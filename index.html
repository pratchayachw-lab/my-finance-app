<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WalletSync</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0a0f;
  --bg2:       #111118;
  --bg3:       #1a1a24;
  --border:    #2a2a38;
  --border2:   #3a3a50;
  --text:      #f0f0f8;
  --muted:     #7a7a9a;
  --green:     #00e676;
  --green-bg:  rgba(0,230,118,.1);
  --green-brd: rgba(0,230,118,.25);
  --red:       #ff5370;
  --red-bg:    rgba(255,83,112,.1);
  --red-brd:   rgba(255,83,112,.25);
  --blue:      #64b5f6;
  --blue-bg:   rgba(100,181,246,.1);
  --blue-brd:  rgba(100,181,246,.25);
  --amber:     #ffb74d;
  --r:         18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Prompt',sans-serif;overscroll-behavior:none;}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom));}
::-webkit-scrollbar{width:0;height:0;}
input,select,button{font-family:'Prompt',sans-serif;border:none;outline:none;background:none;cursor:pointer;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}

/* ── NAV ── */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:stretch;justify-content:space-around;
  height:calc(60px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;padding:8px 4px;}
.nb-icon{font-size:20px;line-height:1;transition:transform .2s;}
.nb-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.nb.on .nb-lbl{color:var(--green);}
.nb.on .nb-icon{transform:scale(1.15);}

/* ── HEADER ── */
#hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,15,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
}
.hdr-inner{display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto;}

/* ── FAB ── */
#fab{
  position:fixed;bottom:calc(68px + env(safe-area-inset-bottom) + 14px);right:18px;z-index:150;
  width:54px;height:54px;border-radius:17px;
  background:var(--green);color:#0a0a0f;font-size:26px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 0 rgba(0,230,118,.5);
  animation:pulse 2.5s infinite;
  transition:transform .15s,background .2s;
}
#fab:active{transform:scale(.9);}
#fab.editing{background:var(--amber);box-shadow:0 0 0 0 rgba(255,183,77,.5);animation:pulseAmber 2.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,.4);}50%{box-shadow:0 0 0 8px rgba(0,230,118,0);}}
@keyframes pulseAmber{0%,100%{box-shadow:0 0 0 0 rgba(255,183,77,.4);}50%{box-shadow:0 0 0 8px rgba(255,183,77,0);}}

/* ── SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(6px);}
.overlay.on{opacity:1;pointer-events:all;}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:301;
  background:var(--bg2);border-top:1px solid var(--border);
  border-radius:24px 24px 0 0;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
  max-height:94vh;overflow-y:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0);}
.handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:12px auto 4px;}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);}
.card2{background:var(--bg3);border:1px solid var(--border);border-radius:14px;}

/* ── TYPE TABS ── */
.ttabs{display:flex;gap:6px;}
.tt{
  flex:1;padding:11px 8px;border-radius:13px;font-size:13px;font-weight:700;
  border:1.5px solid var(--border);color:var(--muted);transition:all .18s;
}
.tt.e{background:var(--red-bg);color:var(--red);border-color:var(--red-brd);}
.tt.i{background:var(--green-bg);color:var(--green);border-color:var(--green-brd);}
.tt.t{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-brd);}

/* ── NUMPAD ── */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.nk{
  height:60px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);
  font-size:21px;font-weight:600;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:all .1s;user-select:none;
}
.nk:active{background:var(--border2);transform:scale(.93);}
.nk.del{color:var(--muted);}
.amt{font-size:46px;font-weight:900;text-align:center;padding:14px 0 2px;letter-spacing:-2px;line-height:1;}
.amt.e{color:var(--red);}
.amt.i{color:var(--green);}
.amt.t{color:var(--blue);}

/* ── CAT GRID ── */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.cc{
  padding:11px 4px;border-radius:13px;border:1.5px solid var(--border);
  background:var(--bg3);display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all .18s;cursor:pointer;
}
.cc-emoji{font-size:22px;line-height:1.1;}
.cc-name{font-size:10px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;}
.cc.sel{border-color:var(--green);background:var(--green-bg);}
.cc.sel .cc-name{color:var(--green);}

/* ── FIELD ── */
.f{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500;color:var(--text);width:100%;}
.f:focus{border-color:var(--green);}
.fl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
select.f option{background:var(--bg2);}

/* ── TX ITEM ── */
.txi{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:background .12s;}
.txi:active{background:var(--bg3);}
.txi-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.txi-ico.e{background:var(--red-bg);}
.txi-ico.i{background:var(--green-bg);}
.txi-ico.t{background:var(--blue-bg);}
.dsep{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:10px 4px 5px;}

/* ── ACC CARD ── */
.ac{border-radius:var(--r);padding:18px;overflow:hidden;position:relative;}
.ac.asset{background:linear-gradient(135deg,#0a1a10,#0f2a18);border:1px solid var(--green-brd);}
.ac.investment{background:linear-gradient(135deg,#0a0f1a,#0f1a2d);border:1px solid var(--blue-brd);}
.ac.debt{background:linear-gradient(135deg,#1a0a0a,#2d0f0f);border:1px solid var(--red-brd);}

/* ── PROGRESS ── */
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:8px;}
.pfill{height:100%;border-radius:3px;transition:width .6s ease;}

/* ── MISC ── */
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.05em;}
.pill.asset{background:var(--green-bg);color:var(--green);}
.pill.investment{background:var(--blue-bg);color:var(--blue);}
.pill.debt{background:var(--red-bg);color:var(--red);}
.sec{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.fade{animation:fade .3s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── LOADING ── */
#load{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.spin{width:30px;height:30px;border:2.5px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{
  position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:400;
  background:var(--bg3);border:1px solid var(--border2);border-radius:12px;
  padding:9px 18px;font-size:12px;font-weight:700;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:var(--green-brd);color:var(--green);}
#toast.err{border-color:var(--red-brd);color:var(--red);}

/* ── BTN ── */
.btn-g{width:100%;padding:15px;border-radius:14px;background:var(--green);color:#0a0a0f;font-size:15px;font-weight:800;letter-spacing:.02em;}
.btn-ghost{width:100%;padding:14px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);font-size:14px;font-weight:700;color:var(--muted);}
</style>
</head>
<body>

<!-- LOADING -->
<div id="load">
  <div class="spin"></div>
  <p style="font-size:12px;font-weight:600;color:var(--muted);" id="load-txt">กำลังโหลด...</p>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ════════════════ HEADER ════════════════ -->
<header id="hdr">
  <div class="hdr-inner">
    <div>
      <div style="font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1px;">NET WORTH</div>
      <div id="h-nw" style="font-size:24px;font-weight:900;letter-spacing:-1px;color:var(--green);line-height:1;">฿0</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="text-align:right;">
        <div style="font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;">เดือนนี้</div>
        <div id="h-net" style="font-size:15px;font-weight:800;color:var(--green);">฿0</div>
      </div>
      <button onclick="toggleSync()" id="sync-btn" style="width:36px;height:36px;border-radius:11px;background:var(--bg3);border:1px solid var(--border);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;">
        <span id="sync-ic">☁️</span>
      </button>
    </div>
  </div>
</header>

<!-- ════════════════ MAIN ════════════════ -->
<main style="max-width:480px;margin:0 auto;padding:12px 14px;">

  <!-- HOME -->
  <div id="v-home" class="fade" style="display:block;">
    <!-- Strip -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px;">
      <div class="card2" style="padding:11px;text-align:center;">
        <div style="font-size:9px;font-weight:700;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;">รับ</div>
        <div id="s-inc" style="font-size:15px;font-weight:900;color:var(--green);letter-spacing:-.5px;">฿0</div>
      </div>
      <div class="card2" style="padding:11px;text-align:center;">
        <div style="font-size:9px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;">จ่าย</div>
        <div id="s-exp" style="font-size:15px;font-weight:900;color:var(--red);letter-spacing:-.5px;">฿0</div>
      </div>
      <div class="card2" style="padding:11px;text-align:center;">
        <div style="font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;">แผน</div>
        <div id="s-plan" style="font-size:15px;font-weight:900;color:var(--muted);letter-spacing:-.5px;">฿0</div>
      </div>
    </div>

    <!-- Recent -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
      <span class="sec">รายการล่าสุด</span>
      <button onclick="switchTab('history')" style="font-size:11px;font-weight:700;color:var(--green);">ดูทั้งหมด →</button>
    </div>
    <div id="recent-list" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>

  <!-- ACCOUNTS -->
  <div id="v-accounts" class="fade" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="sec">บัญชีทั้งหมด</span>
      <button onclick="openAccSheet()" style="width:34px;height:34px;border-radius:11px;background:var(--green);color:#0a0a0f;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:300;flex-shrink:0;">+</button>
    </div>
    <div class="card" style="padding:14px;margin-bottom:12px;">
      <canvas id="chart-acc" height="180"></canvas>
    </div>
    <div id="acc-list" style="display:flex;flex-direction:column;gap:9px;"></div>
  </div>

  <!-- BUDGET -->
  <div id="v-budget" class="fade" style="display:none;">
    <!-- Month tabs -->
    <div style="overflow-x:auto;padding-bottom:4px;margin-bottom:12px;">
      <div id="m-tabs" style="display:flex;gap:6px;width:max-content;"></div>
    </div>
    <!-- Progress list -->
    <div id="bud-progress" style="display:flex;flex-direction:column;gap:9px;margin-bottom:14px;"></div>
    <!-- Toggle manage -->
    <button onclick="toggleManage()" id="mgr-btn" style="width:100%;padding:12px;border-radius:13px;border:1px dashed var(--border2);font-size:12px;font-weight:700;color:var(--muted);background:transparent;margin-bottom:10px;transition:all .2s;">⚙️ จัดการหมวดหมู่ & ตั้งงบประมาณ</button>
    <div id="mgr-sec" style="display:none;flex-direction:column;gap:10px;">
      <!-- Add cat -->
      <div class="card" style="padding:14px;">
        <div class="sec" style="margin-bottom:10px;">เพิ่มหมวดหมู่</div>
        <div style="display:flex;gap:7px;margin-bottom:8px;">
          <select id="new-cat-type" class="f" style="width:auto;flex-shrink:0;padding:10px 10px;">
            <option value="expense">💸 จ่าย</option>
            <option value="income">💰 รับ</option>
          </select>
          <input type="text" id="new-cat-name" class="f" placeholder="ชื่อหมวดหมู่หลัก...">
          <button onclick="addCategory()" style="padding:0 14px;background:var(--green);color:#0a0a0f;border-radius:12px;font-weight:900;font-size:20px;flex-shrink:0;">+</button>
        </div>
        <div style="display:flex;gap:7px;">
          <select id="sub-parent" class="f" style="flex:1;padding:10px 10px;"></select>
          <input type="text" id="new-sub-name" class="f" style="flex:1;" placeholder="ชื่อย่อย...">
          <button onclick="addSubCat()" style="padding:0 14px;background:var(--bg3);color:var(--green);border:1.5px solid var(--green-brd);border-radius:12px;font-weight:900;font-size:20px;flex-shrink:0;">+</button>
        </div>
      </div>
      <!-- Cat list -->
      <div class="card" style="padding:14px;">
        <div class="sec" style="margin-bottom:8px;">💸 รายจ่าย</div>
        <div id="cl-exp" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;"></div>
        <div class="sec" style="margin-bottom:8px;">💰 รายรับ</div>
        <div id="cl-inc" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
      <!-- Budget inputs -->
      <div class="card" style="padding:14px;">
        <div class="sec" style="margin-bottom:12px;">ตั้งงบประมาณ</div>
        <div id="be-inc" style="margin-bottom:10px;"></div>
        <div class="divider"></div>
        <div id="be-exp"></div>
        <div style="display:flex;gap:7px;margin-top:12px;">
          <button onclick="copyPrev()" class="btn-ghost" style="flex:1;">คัดลอกเดือนก่อน</button>
          <button onclick="saveBudgets()" style="flex:2;padding:14px;border-radius:14px;background:var(--green);color:#0a0a0f;font-size:14px;font-weight:800;">บันทึกงบประมาณ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="v-history" class="fade" style="display:none;">
    <div style="position:relative;margin-bottom:11px;">
      <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;">🔍</span>
      <input type="text" id="srch" class="f" placeholder="ค้นหารายการ..." style="padding-left:38px;" oninput="renderHistory()">
    </div>
    <div id="hist-list" style="display:flex;flex-direction:column;gap:5px;"></div>
  </div>

</main>

<!-- FAB -->
<div id="fab" onclick="openTxSheet()">+</div>

<!-- NAV -->
<nav id="nav">
  <button class="nb on" id="nb-home"     onclick="switchTab('home')">    <span class="nb-icon">🏠</span><span class="nb-lbl">หน้าแรก</span></button>
  <button class="nb"    id="nb-accounts" onclick="switchTab('accounts')"><span class="nb-icon">💳</span><span class="nb-lbl">บัญชี</span></button>
  <button class="nb"    id="nb-budget"   onclick="switchTab('budget')">  <span class="nb-icon">📊</span><span class="nb-lbl">แผนงาน</span></button>
  <button class="nb"    id="nb-history"  onclick="switchTab('history')"> <span class="nb-icon">🕒</span><span class="nb-lbl">ประวัติ</span></button>
</nav>

<!-- ════ TX SHEET ════ -->
<div class="overlay" id="tx-ov" onclick="closeTxSheet()"></div>
<div class="sheet"   id="tx-sh">
  <div class="handle"></div>
  <div style="padding:0 15px 20px;">

    <!-- Edit badge -->
    <div id="edit-badge" style="display:none;text-align:center;margin-bottom:6px;">
      <span style="font-size:10px;font-weight:700;background:rgba(255,183,77,.15);color:var(--amber);border:1px solid rgba(255,183,77,.3);padding:3px 10px;border-radius:20px;letter-spacing:.06em;">✏️ EDITING</span>
    </div>

    <!-- Type tabs -->
    <div class="ttabs" style="margin-bottom:4px;">
      <button class="tt e" onclick="setType('expense')"  id="tt-e">💸 จ่าย</button>
      <button class="tt"   onclick="setType('income')"   id="tt-i">💰 รับ</button>
      <button class="tt"   onclick="setType('transfer')" id="tt-t">↔️ โอน</button>
    </div>

    <!-- Amount -->
    <div class="amt e" id="amt-disp">฿0</div>
    <div id="amt-hint" style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px;min-height:14px;"></div>

    <!-- Numpad -->
    <div class="numpad" style="margin-bottom:15px;">
      <div class="nk" onclick="nk('1')">1</div><div class="nk" onclick="nk('2')">2</div><div class="nk" onclick="nk('3')">3</div>
      <div class="nk" onclick="nk('4')">4</div><div class="nk" onclick="nk('5')">5</div><div class="nk" onclick="nk('6')">6</div>
      <div class="nk" onclick="nk('7')">7</div><div class="nk" onclick="nk('8')">8</div><div class="nk" onclick="nk('9')">9</div>
      <div class="nk" onclick="nk('.')">.</div><div class="nk" onclick="nk('0')">0</div><div class="nk del" onclick="ndel()">⌫</div>
    </div>

    <!-- Accounts row -->
    <div id="acc-row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px;">
      <div>
        <div class="fl">ต้นทาง</div>
        <select id="f-from" class="f" style="padding:10px 12px;"></select>
      </div>
      <div id="to-wrap" style="display:none;">
        <div class="fl">ปลายทาง</div>
        <select id="f-to" class="f" style="padding:10px 12px;"></select>
      </div>
      <div id="date-wrap">
        <div class="fl">วันที่</div>
        <input type="date" id="f-date" class="f" style="padding:10px 12px;">
      </div>
    </div>

    <!-- Category -->
    <div id="cat-sec">
      <div class="fl" style="margin-bottom:7px;">หมวดหมู่</div>
      <div id="cg-main" class="cgrid" style="margin-bottom:9px;"></div>
      <div id="sub-sec" style="display:none;">
        <div class="fl" style="margin-bottom:7px;">หมวดหมู่ย่อย</div>
        <div id="cg-sub" class="cgrid" style="margin-bottom:9px;"></div>
      </div>
    </div>

    <!-- Note -->

// ═══════════════════════════════════════════
// BUSINESS LOGIC
// ═══════════════════════════════════════════
function revert(id){
  const t=txs.find(t=>t.id===id); if(!t)return;
  const fa=accs.find(a=>a.name===t.from);
  const ta=t.to?accs.find(a=>a.name===t.to):null;
  if(t.type==='expense'){if(fa)fa.balance+=parseFloat(t.amount);}
  else if(t.type==='income'){if(fa)fa.balance-=parseFloat(t.amount);}
  else{if(fa)fa.balance+=parseFloat(t.amount);if(ta)ta.balance-=parseFloat(t.amount);}
}

async function handleTx(){
  const amount=nVal();
  if(!amount||amount<=0)return toast('กรุณากรอกจำนวนเงิน');
  if(txType!=='transfer'&&!selCat)return toast('กรุณาเลือกหมวดหมู่');
  const fromId=parseInt(document.getElementById('f-from').value);
  const fromAcc=accs.find(a=>a.id===fromId);
  if(!fromAcc)return toast('ไม่พบบัญชีต้นทาง');

  // balance check
  if(txType!=='income'&&fromAcc.type!=='debt'){
    const chk=editId?fromAcc.balance+(txs.find(t=>t.id===editId)?.amount||0):fromAcc.balance;
    if(amount>chk)return toast('ยอดเงินในบัญชีไม่เพียงพอ');
  }
  if(editId) revert(editId);

  const newTx={
    id:editId||Date.now(), type:txType, amount,
    from:fromAcc.name, from_id:fromAcc.id,
    category: txType==='transfer'?'โอนเงิน':selCat,
    sub_category: selSub||null,
    note: document.getElementById('f-note').value.trim()||'',
    date: document.getElementById('f-date').value||today()
  };

  if(txType==='transfer'){
    const toId=parseInt(document.getElementById('f-to').value);
    const toAcc=accs.find(a=>a.id===toId);
    if(!toAcc)return toast('ไม่พบบัญชีปลายทาง');
    if(toAcc.id===fromId)return toast('บัญชีต้นทางและปลายทางต้องต่างกัน');
    fromAcc.balance-=amount; toAcc.balance+=amount;
    newTx.to=toAcc.name; newTx.to_id=toAcc.id;
    await push('accounts',fromAcc); await push('accounts',toAcc);
  } else if(txType==='expense'){
    fromAcc.balance-=amount; await push('accounts',fromAcc);
  } else {
    fromAcc.balance+=amount; await push('accounts',fromAcc);
  }

  if(editId){const i=txs.findIndex(t=>t.id===editId);if(i!==-1)txs[i]=newTx;}
  else txs.unshift(newTx);
  await push('transactions',newTx);
  closeTxSheet(); renderAll();
  toast(editId?'อัปเดตสำเร็จ ✓':'บันทึกสำเร็จ ✓','ok');
}

  revert(id); txs=txs.filter(t=>t.id!==id);

    await db.from('transactions').delete().eq('id',id);

      if(fa) await push('accounts',fa);
      if(ta) await push('accounts',ta);
    }
  }
  renderAll();
}

// ═══════════════════════════════════════════
// CALCULATIONS
// ═══════════════════════════════════════════
function calcMon(m,y){
  const t=txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y;});
  const inc=t.filter(t=>t.type==='income') .reduce((s,t)=>s+parseFloat(t.amount),0);
  const exp=t.filter(t=>t.type==='expense').reduce((s,t)=>s+parseFloat(t.amount),0);
  return{inc,exp,net:inc-exp,txs:t};
}
function calcPlan(){
  const b=buds[selMon]||{}; let pi=0,pe=0;
  CATS.forEach(c=>{
    const hasSubs=CATS.some(s=>s.parent_id===c.id);
    if((!c.parent_id&&!hasSubs)||c.parent_id){
      const v=parseFloat(b[c.name]||0);
      if(c.type==='income')pi+=v; else pe+=v;
    }
  });
  return pi-pe;
}
function renderCalcs(){
  const now=new Date();
  const nw=accs.reduce((s,a)=>s+parseFloat(a.balance),0);
  const {inc,exp,net}=calcMon(now.getMonth(),now.getFullYear());
  const plan=calcPlan();
  const setEl=(id,v,c)=>{const el=document.getElementById(id);if(!el)return;el.textContent=v;if(c)el.style.color=c;};
  setEl('h-nw', `฿${fmt(nw,2)}`, nw<0?'var(--red)':'var(--green)');
  setEl('h-net',`฿${fmt(net,0)}`,net<0?'var(--red)':'var(--green)');
  setEl('s-inc',`฿${fmtS(inc)}`);
  setEl('s-exp',`฿${fmtS(exp)}`);
  setEl('s-plan',`฿${fmtS(plan)}`,plan<0?'var(--red)':'var(--green)');
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function txHtml(t){
  const ico=t.type==='income'?'💰':t.type==='expense'?'💸':'↔️';
  const sub=t.sub_category?` <span style="color:var(--muted);">›</span> ${t.sub_category}`:'';
  const note=t.note?`<span style="color:var(--muted)"> · ${t.note}</span>`:'';
  return `<div class="txi" onclick="editTx(${t.id})">
    <div class="txi-ico ${t.type[0]}">${ico}</div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.category||'—'}${sub}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:1px;">${t.from||''}${note}</div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div style="font-size:14px;font-weight:900;color:${t.type==='income'?'var(--green)':'var(--red)'};">฿${fmt(t.amount)}</div>
      <button onclick="event.stopPropagation();delTx(${t.id})" style="font-size:9px;font-weight:700;color:var(--muted);padding-top:2px;">ลบ</button>
    </div>
  </div>`;
}

function renderRecent(){
  const el=document.getElementById('recent-list'); if(!el)return;
  const r=txs.slice(0,8);
  el.innerHTML=r.length?r.map(txHtml).join(''):`<div style="text-align:center;padding:36px 0;color:var(--muted);font-size:13px;">กด + เพื่อบันทึกรายการแรก</div>`;
}

function renderHistory(){
  const el=document.getElementById('hist-list'); if(!el)return;
  // FIX#3: guard null
  const q=(document.getElementById('srch')?.value||'').toLowerCase();
  const filtered=txs.filter(t=>(t.note||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q)||(t.sub_category||'').toLowerCase().includes(q));
  if(!filtered.length){el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px;">ไม่พบรายการ</div>`;return;}
  const byDate={};
  filtered.forEach(t=>{const d=t.date?.split('T')[0]||'';if(!byDate[d])byDate[d]=[];byDate[d].push(t);});
  el.innerHTML=Object.entries(byDate).map(([d,ts])=>{
    const dl=d?new Date(d+'T00:00:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'}):'—';
    return`<div class="dsep">${dl}</div>`+ts.map(txHtml).join('');
  }).join('');
}

function renderAccList(){
  const el=document.getElementById('acc-list'); if(!el)return;
  if(!accs.length){el.innerHTML=`<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px;">ยังไม่มีบัญชี</div>`;return;}
  el.innerHTML=accs.map(a=>{
    const b=parseFloat(a.balance);
    const tl=a.type==='investment'?'การลงทุน':a.type==='debt'?'หนี้สิน':'ทรัพย์สิน';
    return `<div class="ac ${a.type}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <span class="pill ${a.type}">${tl}</span>
          <div style="font-size:17px;font-weight:800;margin-top:7px;letter-spacing:-.3px;">${a.name}</div>
          <div style="font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:3px;color:${b<0?'var(--red)':'var(--text)'};">฿${fmt(b,2)}</div>
        </div>
        <button onclick="openAccSheet(${a.id})" style="width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">✏️</button>
      </div>
    </div>`;
  }).join('');
}

function renderChart(){
  const canvas=document.getElementById('chart-acc'); if(!canvas)return;
  if(chart){chart.destroy();chart=null;}
  const nz=accs.filter(a=>parseFloat(a.balance)!==0);
  if(!nz.length)return;
  chart=new Chart(canvas.getContext('2d'),{
    type:'doughnut',
    data:{
      labels:nz.map(a=>a.name),
      datasets:[{data:nz.map(a=>Math.abs(parseFloat(a.balance))),backgroundColor:nz.map((_,i)=>`hsl(${140+i*60},60%,${42+i*4}%)`),borderWidth:3,borderColor:'#111118'}]
    },
    options:{maintainAspectRatio:false,cutout:'78%',plugins:{legend:{display:true,position:'bottom',labels:{color:'#7a7a9a',font:{size:11,family:'Prompt'},boxWidth:11,padding:12}}}}
  });
}

function renderCatList(){
  const pSel=document.getElementById('sub-parent');
  if(pSel){const all=CATS.filter(c=>!c.parent_id);pSel.innerHTML=all.map(c=>`<option value="${c.id}">${emo(c.name)} ${c.name} (${c.type==='income'?'รับ':'จ่าย'})</option>`).join('');}

  const build=type=>{
    const mains=CATS.filter(c=>c.type===type&&!c.parent_id);
    if(!mains.length)return`<div style="font-size:11px;color:var(--muted);padding:6px 0;">ยังไม่มีหมวดหมู่</div>`;
    return mains.map(m=>{
      const subs=CATS.filter(c=>c.parent_id===m.id);
      return`<div class="card2" style="padding:10px 11px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
          <span style="font-size:13px;font-weight:700;">${emo(m.name)} ${m.name}</span>
          <button onclick="delCat(${m.id})" style="font-size:11px;font-weight:700;color:var(--red);">ลบ</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          ${subs.map(s=>`<div style="display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:10px;font-weight:600;">${s.name}<button onclick="delSub(${s.id})" style="color:var(--muted);font-size:12px;line-height:1;margin-left:2px;">×</button></div>`).join('')}
          ${!subs.length?`<span style="font-size:10px;color:var(--muted);">ไม่มีหมวดย่อย</span>`:''}
        </div>
      </div>`;
    }).join('');
  };
  const ee=document.getElementById('cl-exp');const ie=document.getElementById('cl-inc');
  if(ee)ee.innerHTML=build('expense');
  if(ie)ie.innerHTML=build('income');
}

function renderBudProgress(){
  const el=document.getElementById('bud-progress'); if(!el)return;
  const b=buds[selMon]||{};
  const now=new Date(); const y=now.getFullYear();
  const rows=CATS.filter(c=>!c.parent_id).map(m=>{
    const subs=CATS.filter(c=>c.parent_id===m.id);
    const cats=subs.length?subs:[m];
    const budget=cats.reduce((s,c)=>s+(parseFloat(b[c.name])||0),0);
    if(!budget)return'';
    const actTxs=txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===selMon&&d.getFullYear()===y&&(t.category===m.name||cats.some(c=>c.name===t.sub_category||c.name===t.category));});
    const actual=actTxs.reduce((s,t)=>s+parseFloat(t.amount),0);
    const pct=Math.min(budget?actual/budget*100:0,100);
    const over=actual>budget;
    const col=over?'var(--red)':pct>75?'var(--amber)':'var(--green)';
    return`<div class="card" style="padding:13px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:14px;font-weight:700;">${emo(m.name)} ${m.name}</span>
        <div style="text-align:right;">
          <span style="font-size:13px;font-weight:900;color:${over?'var(--red)':'var(--text)'};">฿${fmtS(actual)}</span>
          <span style="font-size:10px;color:var(--muted);"> / ฿${fmtS(budget)}</span>
        </div>
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:${col};"></div></div>
      ${over?`<div style="font-size:10px;color:var(--red);font-weight:700;margin-top:5px;">⚠️ เกินงบ ฿${fmtS(actual-budget)}</div>`:''}
    </div>`;
  }).filter(Boolean);
  el.innerHTML=rows.length?rows.join(''):`<div style="text-align:center;padding:28px;color:var(--muted);font-size:13px;">ยังไม่ได้ตั้งงบประมาณ</div>`;
}

function renderBudEditor(){
  const b=buds[selMon]||{};
  const gen=type=>{
    const mains=CATS.filter(c=>c.type===type&&!c.parent_id);
    if(!mains.length)return'';
    let h=`<p style="font-size:10px;font-weight:700;color:${type==='income'?'var(--green)':'var(--red)'};letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;">${type==='income'?'💰 รายรับ':'💸 รายจ่าย'}</p>`;
    mains.forEach(m=>{
      const subs=CATS.filter(c=>c.parent_id===m.id);
      if(subs.length){
        h+=`<div style="margin-bottom:10px;"><p style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px;">${emo(m.name)} ${m.name}</p><div style="display:flex;flex-direction:column;gap:6px;padding-left:12px;border-left:2px solid var(--border);">${subs.map(s=>`<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:12px;font-weight:600;flex:1;">${s.name}</span><div style="position:relative;"><span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);">฿</span><input type="number" min="0" data-c="${s.name}" value="${b[s.name]||0}" class="bi f" style="width:100px;padding:8px 8px 8px 22px;text-align:right;font-size:12px;font-weight:700;"></div></div>`).join('')}</div></div>`;
      }else{
        h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><span style="font-size:12px;font-weight:600;flex:1;">${emo(m.name)} ${m.name}</span><div style="position:relative;"><span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);">฿</span><input type="number" min="0" data-c="${m.name}" value="${b[m.name]||0}" class="bi f" style="width:100px;padding:8px 8px 8px 22px;text-align:right;font-size:12px;font-weight:700;"></div></div>`;
      }
    });
    return h;
  };
  const ie=document.getElementById('be-inc');const ee=document.getElementById('be-exp');
  if(ie)ie.innerHTML=gen('income'); if(ee)ee.innerHTML=gen('expense');
}

function renderMonthTabs(){
  const el=document.getElementById('m-tabs'); if(!el)return;
  const cur=new Date().getMonth();
  el.innerHTML=MONTHS_S.map((m,i)=>`
    <button onclick="pickMon(${i})" style="padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;
      background:${i===selMon?'var(--green)':'var(--bg3)'};
      color:${i===selMon?'#0a0a0f':'var(--muted)'};
      border:1px solid ${i===selMon?'var(--green)':'var(--border)'};
      ${i===cur?'text-decoration:underline;text-underline-offset:2px;':''}">${m}</button>
  `).join('');
}
function pickMon(i){selMon=i;renderMonthTabs();renderBudProgress();renderBudEditor();renderCalcs();}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
const VIEWS=['home','accounts','budget','history'];
function switchTab(t){
  VIEWS.forEach(v=>{
    document.getElementById(`v-${v}`).style.display='none';
    document.getElementById(`nb-${v}`).classList.remove('on');
  });
  const el=document.getElementById(`v-${t}`);
  el.style.display='block'; void el.offsetWidth; el.classList.add('fade');
  document.getElementById(`nb-${t}`).classList.add('on');
  if(t==='accounts'){renderAccList();renderChart();}
  if(t==='budget'){renderMonthTabs();renderBudProgress();renderBudEditor();renderCatList();}
  if(t==='history')renderHistory();
  window.scrollTo(0,0);
}

function toggleManage(){
  manOpen=!manOpen;
  document.getElementById('mgr-sec').style.display=manOpen?'flex':'none';
  document.getElementById('mgr-btn').textContent=manOpen?'✕ ปิดหน้าจัดการ':'⚙️ จัดการหมวดหมู่ & ตั้งงบประมาณ';
  if(manOpen)renderCatList();
}

async function toggleSync(){
  syncOn=!syncOn;
  localStorage.setItem('ws_sync',String(syncOn));
  document.getElementById('sync-ic').textContent=syncOn?'☁️':'💤';
  if(syncOn) await pullCloud();
  else toast('โหมด Local เท่านั้น','err');
}

// ═══════════════════════════════════════════
// STORAGE & INIT
// ═══════════════════════════════════════════
function save(){
  localStorage.setItem(KEY.A,JSON.stringify(accs));
  localStorage.setItem(KEY.T,JSON.stringify(txs));
  localStorage.setItem(KEY.C,JSON.stringify(CATS));
  localStorage.setItem(KEY.B,JSON.stringify(buds));
}
function ensureBuds(){
  for(let i=0;i<12;i++){
    if(!buds[i])buds[i]={};
    CATS.forEach(c=>{if(buds[i][c.name]===undefined)buds[i][c.name]=0;});
  }
}
function renderAll(){
  renderCalcs(); renderRecent(); save();
}

window.onload=async()=>{
  setLoad(true,'กำลังโหลด...');
  ensureBuds();
  document.getElementById('sync-ic').textContent=syncOn?'☁️':'💤';
  await initDB();
  renderAll();
  renderMonthTabs();
  setType('expense');
  setLoad(false);
};
</script>
</body>
