<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WalletSync AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        },
                        income: '#10b981',
                        expense: '#f43f5e',
                        invest: '#3b82f6',
                        debt: '#e11d48'
                    },
                    borderRadius: { 'xl2': '1.25rem', 'xl3': '2rem' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item.active { color: #059669; }
        .nav-item.active .icon-bg { background-color: #dcfce7; }
        .chart-container { position: relative; width: 100%; height: 220px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: slideUp 0.3s ease-out forwards; }
        .custom-scroll::-webkit-scrollbar { display: none; }
        input[type="date"], select, input[type="number"] { font-size: 16px !important; }
        .edit-mode { border: 2px solid #fbbf24 !important; background-color: #fffbeb !important; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- Header Status Bar -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-40 px-5 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg shadow-brand-500/30">฿</div>
            <div>
                <h1 class="text-sm font-bold text-slate-400 uppercase tracking-tighter leading-none">Net Worth</h1>
                <span class="text-xl font-black text-brand-700" id="display-net-worth">฿ 0.00</span>
            </div>
        </div>
        <div class="flex gap-2">
            <div id="sync-status" class="w-3 h-3 rounded-full bg-slate-200 self-center" title="สถานะการซิงค์"></div>
            <button onclick="toggleCloudConfig()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100">⚙️</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- VIEW: OVERVIEW -->
        <div id="view-overview" class="fade-in space-y-6">
            <!-- Form Card -->
            <div id="form-container" class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="form-title" class="font-bold text-slate-800">จดบันทึกรายการ</h3>
                    <div id="edit-indicator" class="hidden text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded">โหมดแก้ไข</div>
                </div>

                <form onsubmit="handleTransaction(event)" class="space-y-4">
                    <div class="flex p-1 bg-slate-100 rounded-2xl">
                        <button type="button" onclick="setTxType('expense')" id="btn-type-expense" class="flex-1 py-2 text-sm font-bold rounded-xl bg-white shadow-sm text-expense transition-all">จ่าย</button>
                        <button type="button" onclick="setTxType('income')" id="btn-type-income" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500 transition-all">รับ</button>
                        <button type="button" onclick="setTxType('transfer')" id="btn-type-transfer" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500 transition-all">โอน</button>
                    </div>
                    <input type="hidden" id="tx-type" value="expense">

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ต้นทาง</label>
                            <select id="from-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="to-account-div" class="space-y-1 hidden">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ปลายทาง</label>
                            <select id="to-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="date-div" class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">วันที่</label>
                            <input type="date" id="tx-date" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                        </div>
                    </div>

                    <div class="relative">
                        <input type="number" id="tx-amount" required placeholder="0.00" class="w-full p-5 bg-brand-50 border border-brand-100 rounded-2xl text-3xl font-black text-brand-700 text-center outline-none">
                        <div class="absolute left-5 top-1/2 -translate-y-1/2 text-brand-300 font-bold">฿</div>
                    </div>

                    <div id="cat-select-container" class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">หมวดหมู่</label>
                        <select id="tx-category" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                    </div>

                    <input type="text" id="tx-note" placeholder="บันทึกช่วยจำ..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submit-btn" class="flex-grow py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/20 active:scale-95 transition-all">บันทึกรายการ</button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden px-6 bg-slate-100 text-slate-500 font-bold rounded-2xl">ยกเลิก</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm space-y-5">
                <div class="flex justify-between items-center">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest text-slate-400">สถานะงบประมาณ</h4>
                    <span class="text-[10px] font-bold text-brand-600" id="current-month-display"></span>
                </div>
                <div id="budget-bars" class="space-y-4"></div>
            </div>

            <div class="bg-slate-900 text-white p-6 rounded-xl3 shadow-xl overflow-hidden relative">
                <div class="relative z-10 space-y-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center text-xl">✨</div>
                        <h3 class="text-lg font-bold text-brand-100 tracking-tight">AI Advisor</h3>
                    </div>
                    <div id="ai-insight" class="bg-white/5 p-4 rounded-2xl text-sm italic min-h-[80px] flex items-center text-brand-100">
                        "กรุณาบันทึกข้อมูลเพื่อรับคำแนะนำ..."
                    </div>
                    <button onclick="analyzeFinancialHealth()" id="btn-analyze" class="w-full py-3 bg-white text-slate-900 font-bold rounded-2xl active:scale-95 transition-all">วิเคราะห์ความมั่งคั่ง</button>
                </div>
            </div>
        </div>

        <!-- VIEW: ACCOUNTS -->
        <div id="view-accounts" class="hidden fade-in space-y-6">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-xl font-black text-slate-800">จัดการบัญชี</h3>
                <button onclick="openAccountModal()" class="w-12 h-12 bg-brand-600 text-white rounded-2xl font-bold flex items-center justify-center shadow-lg active:scale-90 transition-all">+</button>
            </div>
            <div class="bg-white p-5 rounded-xl3 shadow-sm border border-slate-100">
                <div class="chart-container"><canvas id="assetChart"></canvas></div>
            </div>
            <div id="account-grid" class="space-y-4"></div>
        </div>

        <!-- VIEW: BUDGET -->
        <div id="view-budget" class="hidden fade-in space-y-8">
            <div class="bg-white p-6 rounded-xl3 shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-brand-700 mb-4">หมวดหมู่รายรับ/จ่าย</h3>
                <div class="flex flex-wrap gap-2 mb-6">
                    <select id="new-cat-type" class="p-2 border rounded-xl text-sm bg-slate-50 outline-none">
                        <option value="expense">จ่าย</option>
                        <option value="income">รับ</option>
                    </select>
                    <input type="text" id="new-cat-name" placeholder="ชื่อหัวข้อ..." class="flex-grow p-2 border rounded-xl text-sm outline-none">
                    <button onclick="addCategory()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold">เพิ่ม</button>
                </div>
                <div class="space-y-4">
                    <div id="cat-list-expense" class="flex flex-wrap gap-2"></div>
                    <div id="cat-list-income" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl3 shadow-sm border border-slate-200">
                <div class="flex gap-2 overflow-x-auto pb-4 mb-6 custom-scroll" id="budget-month-selector"></div>
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-slate-700">เดือน: <span id="editing-month-name" class="text-brand-600"></span></h4>
                        <button onclick="copyPrevMonthBudget()" class="text-[10px] font-bold text-brand-600 uppercase">คัดลอกเดือนก่อน</button>
                    </div>
                    <div id="budget-editor-income" class="space-y-3 border-b border-slate-100 pb-6"></div>
                    <div id="budget-editor-expense" class="space-y-3"></div>
                    <button onclick="saveBudgets()" class="w-full mt-6 py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">บันทึกแผนงาน</button>
                </div>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="hidden fade-in space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <input type="text" id="filter-search" placeholder="ค้นหาบันทึก..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none" oninput="renderHistory()">
                <div id="filter-acc-chips" class="flex gap-2 overflow-x-auto pb-2 custom-scroll"></div>
            </div>
            <div id="history-container" class="space-y-3"></div>
            <div id="no-results" class="hidden py-20 text-center text-slate-400 italic">ไม่พบรายการ...</div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-20 bottom-nav px-2 z-50">
        <button onclick="switchTab('overview')" id="nav-overview" class="nav-item active flex flex-col items-center gap-1 transition-all">
            <div class="icon-bg p-2 transition-all">🏠</div>
            <span class="text-[10px] font-bold uppercase tracking-tighter">หน้าแรก</span>
        </button>
        <button onclick="switchTab('accounts')" id="nav-accounts" class="nav-item flex flex-col items-center gap-1 transition-all">
            <div class="icon-bg p-2 transition-all">💳</div>
            <span class="text-[10px] font-bold uppercase tracking-tighter">บัญชี</span>
        </button>
        <button onclick="switchTab('budget')" id="nav-budget" class="nav-item flex flex-col items-center gap-1 transition-all">
            <div class="icon-bg p-2 transition-all">📊</div>
            <span class="text-[10px] font-bold uppercase tracking-tighter">แผนงาน</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-item flex flex-col items-center gap-1 transition-all">
            <div class="icon-bg p-2 transition-all">🕒</div>
            <span class="text-[10px] font-bold uppercase tracking-tighter">ประวัติ</span>
        </button>
    </nav>

    <!-- Cloud Config Modal -->
    <div id="cloud-modal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-black mb-4 text-brand-700">☁️ Cloud Sync (Supabase)</h3>
            <p class="text-xs text-slate-500 mb-6 tracking-wide">เชื่อมต่อ API Key เพื่อบันทึกข้อมูลออนไลน์</p>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Project URL</label>
                    <input type="text" id="supabase-url-input" placeholder="https://xxx.supabase.co" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Anon Key</label>
                    <input type="password" id="supabase-key-input" placeholder="วาง Anon API Key ที่นี่..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                </div>
            </div>
            <div class="flex gap-2 mt-8">
                <button onclick="saveCloudConfig()" class="flex-1 py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">เชื่อมต่อ</button>
                <button onclick="toggleCloudConfig()" class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Account Modal -->
    <div id="account-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-xl font-black mb-6" id="acc-modal-title">จัดการบัญชี</h3>
            <div class="space-y-4">
                <input type="text" id="new-acc-name" placeholder="ชื่อบัญชี..." class="w-full p-4 border rounded-2xl text-sm outline-none">
                <select id="new-acc-type" class="w-full p-4 border rounded-2xl text-sm outline-none">
                    <option value="asset">ทรัพย์สิน/เงินสด</option>
                    <option value="investment">การลงทุน</option>
                    <option value="debt">หนี้สิน</option>
                </select>
                <input type="number" id="new-acc-balance" placeholder="ยอดเริ่มต้น..." class="w-full p-4 border rounded-2xl text-sm outline-none">
            </div>
            <div class="flex gap-2 mt-8">
                <button onclick="saveAccount()" class="flex-1 py-4 bg-brand-600 text-white font-bold rounded-2xl active:scale-95 transition-all">บันทึก</button>
                <button onclick="closeAccountModal()" class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // --- Globals & State ---
        const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        let supabaseClient = null;

        let CATEGORIES = JSON.parse(localStorage.getItem('ws_cats_v5')) || [
            { name: 'เงินเดือน', type: 'income' }, { name: 'อาหาร', type: 'expense' },
            { name: 'เดินทาง', type: 'expense' }, { name: 'ที่พัก', type: 'expense' }
        ];

        let accounts = JSON.parse(localStorage.getItem('ws_accs_v5')) || [
            { id: 1, name: 'เงินสด', type: 'asset', balance: 0 }
        ];

        let transactions = JSON.parse(localStorage.getItem('ws_txs_v5')) || [];
        let annualBudgets = JSON.parse(localStorage.getItem('ws_budgets_v5')) || {};
        
        let editingTxId = null;
        let selectedBudgetMonth = new Date().getMonth();
        let assetChart = null;

        // --- Core Lifecycle ---
        function init() {
            initSupabase();
            ensureBudgetIntegrity();
            setDefaultDate();
            renderAll();
            renderMonthSelector();
            
            const monthDisplay = document.getElementById('current-month-display');
            if (monthDisplay) monthDisplay.innerText = MONTHS[new Date().getMonth()];
        }

        function initSupabase() {
            const url = localStorage.getItem('ws_supabase_url');
            const key = localStorage.getItem('ws_supabase_key');
            if (url && key && typeof supabase !== 'undefined') {
                try {
                    supabaseClient = supabase.createClient(url, key);
                    const statusEl = document.getElementById('sync-status');
                    if (statusEl) {
                        statusEl.classList.remove('bg-slate-200');
                        statusEl.classList.add('bg-brand-500');
                    }
                } catch (e) { console.error("Supabase fail", e); }
            }
        }

        function toggleCloudConfig() {
            const modal = document.getElementById('cloud-modal');
            const urlInput = document.getElementById('supabase-url-input');
            const keyInput = document.getElementById('supabase-key-input');
            if (urlInput) urlInput.value = localStorage.getItem('ws_supabase_url') || "";
            if (keyInput) keyInput.value = localStorage.getItem('ws_supabase_key') || "";
            if (modal) modal.classList.toggle('hidden');
        }

        function saveCloudConfig() {
            const url = document.getElementById('supabase-url-input')?.value.trim();
            const key = document.getElementById('supabase-key-input')?.value.trim();
            if(!url || !key) return alert("กรุณากรอกข้อมูลให้ครบ");
            localStorage.setItem('ws_supabase_url', url);
            localStorage.setItem('ws_supabase_key', key);
            initSupabase();
            toggleCloudConfig();
            alert("บันทึกการเชื่อมต่อแล้ว");
        }

        function ensureBudgetIntegrity() {
            for(let i=0; i<12; i++) {
                if (!annualBudgets[i]) annualBudgets[i] = {};
                CATEGORIES.forEach(cat => {
                    if (annualBudgets[i][cat.name] === undefined) annualBudgets[i][cat.name] = 0;
                });
            }
        }

        function setDefaultDate() {
            const dateInput = document.getElementById('tx-date');
            if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
        }

        function renderAll() {
            updateCalculations();
            renderAccountGrid();
            renderCharts();
            renderBudgetBars();
            renderBudgetEditor();
            renderCategoryList();
            populateSelectors();
            renderHistory();

            localStorage.setItem('ws_accs_v5', JSON.stringify(accounts));
            localStorage.setItem('ws_txs_v5', JSON.stringify(transactions));
            localStorage.setItem('ws_budgets_v5', JSON.stringify(annualBudgets));
            localStorage.setItem('ws_cats_v5', JSON.stringify(CATEGORIES));
        }

        function switchTab(tab) {
            ['overview', 'accounts', 'budget', 'history'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const nav = document.getElementById(`nav-${v}`);
                if(el) el.classList.add('hidden');
                if(nav) nav.classList.remove('active');
            });
            const target = document.getElementById(`view-${tab}`);
            const targetNav = document.getElementById(`nav-${tab}`);
            if(target) target.classList.remove('hidden');
            if(targetNav) targetNav.classList.add('active');
            if(tab === 'overview') renderCharts();
            window.scrollTo(0, 0);
        }

        // --- Logic Handlers ---
        function setTxType(type) {
            const txTypeInput = document.getElementById('tx-type');
            if (txTypeInput) txTypeInput.value = type;
            ['income', 'expense', 'transfer'].forEach(t => {
                const btn = document.getElementById(`btn-type-${t}`);
                if (btn) {
                    if (t === type) {
                        btn.classList.add('bg-white', 'shadow-sm', `text-${t}`);
                        btn.classList.remove('text-slate-500');
                    } else {
                        btn.classList.remove('bg-white', 'shadow-sm', 'text-expense', 'text-income', 'text-transfer');
                        btn.classList.add('text-slate-500');
                    }
                }
            });
            const toAccDiv = document.getElementById('to-account-div');
            const catContainer = document.getElementById('cat-select-container');
            if(toAccDiv) toAccDiv.classList.toggle('hidden', type !== 'transfer');
            if(catContainer) catContainer.classList.toggle('hidden', type === 'transfer');
            populateSelectors();
        }

        function handleTransaction(e) {
            e.preventDefault();
            if (editingTxId) revertBalance(editingTxId);

            const type = document.getElementById('tx-type')?.value;
            const amountStr = document.getElementById('tx-amount')?.value;
            const fromId = parseInt(document.getElementById('from-account')?.value);
            
            if (!type || !amountStr || isNaN(fromId)) return;
            
            const amount = parseFloat(amountStr);
            const fromAcc = accounts.find(a => a.id === fromId);

            if ((type === 'expense' || type === 'transfer') && amount > fromAcc.balance && fromAcc.type !== 'debt') {
                return alert("ยอดเงินไม่พอ! กรุณายืมจากหนี้สินหรือโอนเงินเข้ามาก่อน");
            }

            let newTx = {
                id: editingTxId || Date.now(),
                type, amount, from: fromAcc.name,
                category: type === 'transfer' ? 'โอนเงิน' : (document.getElementById('tx-category')?.value || 'อื่นๆ'),
                note: document.getElementById('tx-note')?.value || '',
                date: document.getElementById('tx-date')?.value || new Date().toISOString().split('T')[0]
            };

            if (type === 'transfer') {
                const toId = parseInt(document.getElementById('to-account')?.value);
                const toAcc = accounts.find(a => a.id === toId);
                if (toAcc) {
                    fromAcc.balance -= amount;
                    toAcc.balance += amount;
                    newTx.to = toAcc.name;
                }
            } else if (type === 'expense') {
                fromAcc.balance -= amount;
            } else {
                fromAcc.balance += amount;
            }

            if (editingTxId) {
                const idx = transactions.findIndex(t => t.id === editingTxId);
                if(idx !== -1) transactions[idx] = newTx;
            } else transactions.unshift(newTx);

            resetForm(); renderAll();
        }

        function revertBalance(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            const f = accounts.find(a => a.name === tx.from);
            const t = accounts.find(a => a.name === tx.to);
            if (tx.type === 'expense') { if(f) f.balance += tx.amount; }
            else if (tx.type === 'income') { if(f) f.balance -= tx.amount; }
            else { if(f) f.balance += tx.amount; if(t) t.balance -= tx.amount; }
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            if(!tx) return;
            editingTxId = id;
            switchTab('overview');
            document.getElementById('form-container')?.classList.add('edit-mode');
            document.getElementById('edit-indicator')?.classList.remove('hidden');
            setTxType(tx.type);
            if(document.getElementById('tx-amount')) document.getElementById('tx-amount').value = tx.amount;
            if(document.getElementById('tx-note')) document.getElementById('tx-note').value = tx.note;
            if(document.getElementById('tx-date')) document.getElementById('tx-date').value = tx.date;
            if(document.getElementById('tx-category')) document.getElementById('tx-category').value = tx.category;
            const submitBtn = document.getElementById('submit-btn');
            if(submitBtn) submitBtn.innerText = "อัปเดตรายการ";
            document.getElementById('cancel-edit-btn')?.classList.remove('hidden');
        }

        function resetForm() {
            editingTxId = null;
            document.querySelector('form')?.reset();
            document.getElementById('form-container')?.classList.remove('edit-mode');
            document.getElementById('edit-indicator')?.classList.add('hidden');
            const submitBtn = document.getElementById('submit-btn');
            if(submitBtn) submitBtn.innerText = "บันทึกรายการ";
            document.getElementById('cancel-edit-btn')?.classList.add('hidden');
            setTxType('expense'); setDefaultDate();
        }

        // --- Renderers ---
        function populateSelectors() {
            const opts = accounts.map(a => `<option value="${a.id}">${a.name} (฿${a.balance.toLocaleString()})</option>`).join('');
            const fromAcc = document.getElementById('from-account');
            const toAcc = document.getElementById('to-account');
            if(fromAcc) fromAcc.innerHTML = opts;
            if(toAcc) toAcc.innerHTML = opts;
            
            const currentType = document.getElementById('tx-type')?.value || 'expense';
            const cats = CATEGORIES.filter(c => c.type === currentType);
            const catSel = document.getElementById('tx-category');
            if(catSel) catSel.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderAccountGrid() {
            const grid = document.getElementById('account-grid');
            if(!grid) return;
            grid.innerHTML = accounts.map(a => `
                <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div>
                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded bg-slate-100">${a.type}</span>
                        <h4 class="font-bold text-slate-700">${a.name}</h4>
                        <p class="text-lg font-black ${a.type==='debt'?'text-rose-500':'text-slate-900'}">฿${a.balance.toLocaleString()}</p>
                    </div>
                    <button onclick="openAccountModal(${a.id})" class="p-3 bg-slate-50 rounded-xl text-slate-300">✏️</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const noRes = document.getElementById('no-results');
            if(!container) return;
            const q = document.getElementById('filter-search')?.value.toLowerCase() || "";
            const filtered = transactions.filter(t => t.note.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
            
            container.innerHTML = filtered.map(t => `
                <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center active:bg-slate-50" onclick="editTx(${t.id})">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center ${t.type==='income'?'bg-emerald-50':'bg-rose-50'}">
                            ${t.type==='income'?'💰':'💸'}
                        </div>
                        <div>
                            <h4 class="font-bold text-sm">${t.category}</h4>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">${t.date} • ${t.from}</p>
                        </div>
                    </div>
                    <p class="font-black ${t.type==='income'?'text-emerald-600':'text-rose-500'}">
                        ${t.type==='expense'?'-':t.type==='income'?'+':''}฿${t.amount.toLocaleString()}
                    </p>
                </div>
            `).join('');
            if(noRes) noRes.classList.toggle('hidden', filtered.length > 0);
        }

        function renderBudgetBars() {
            const container = document.getElementById('budget-bars');
            if(!container) return;
            const cur = new Date().getMonth();
            const b = annualBudgets[cur] || {};
            const totals = {};
            transactions.filter(t => new Date(t.date).getMonth() === cur).forEach(t => totals[t.category] = (totals[t.category]||0) + t.amount);
            
            container.innerHTML = CATEGORIES.slice(0, 4).map(c => {
                const limit = b[c.name] || 0;
                const actual = totals[c.name] || 0;
                const pct = limit > 0 ? Math.min((actual/limit)*100, 100) : 0;
                return `
                    <div class="space-y-1">
                        <div class="flex justify-between text-[9px] font-black uppercase">
                            <span class="text-slate-500">${c.name}</span>
                            <span>฿${actual.toLocaleString()} / ฿${limit.toLocaleString()}</span>
                        </div>
                        <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-brand-500 transition-all duration-700" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMonthSelector() {
            const sel = document.getElementById('budget-month-selector');
            const editingMonthDisplay = document.getElementById('editing-month-name');
            if(!sel) return;
            sel.innerHTML = MONTHS.map((m, i) => `
                <button onclick="selectMonth(${i})" class="px-5 py-2 whitespace-nowrap rounded-full border text-xs font-bold ${i===selectedBudgetMonth?'bg-brand-600 text-white border-brand-600 shadow-md':'bg-white text-slate-500'}">
                    ${m}
                </button>
            `).join('');
            if(editingMonthDisplay) editingMonthDisplay.innerText = MONTHS[selectedBudgetMonth];
        }

        function selectMonth(i) { selectedBudgetMonth = i; renderMonthSelector(); renderBudgetEditor(); }

        function renderBudgetEditor() {
            const inc = document.getElementById('budget-editor-income');
            const exp = document.getElementById('budget-editor-expense');
            if(!inc || !exp) return;
            const b = annualBudgets[selectedBudgetMonth] || {};
            const input = (c) => `
                <div class="flex items-center gap-3">
                    <label class="flex-grow text-xs font-bold text-slate-500">${c.name}</label>
                    <input type="number" data-cat="${c.name}" value="${b[c.name]||0}" class="budget-input w-24 p-2 border rounded-xl text-right text-xs outline-none focus:ring-1 focus:ring-brand-400">
                </div>
            `;
            inc.innerHTML = `<p class="text-[9px] font-bold text-emerald-600 uppercase mb-2">💰 เป้าหมายรายรับ</p>` + CATEGORIES.filter(c => c.type === 'income').map(input).join('');
            exp.innerHTML = `<p class="text-[9px] font-bold text-rose-600 uppercase mb-2">💸 งบประมาณรายจ่าย</p>` + CATEGORIES.filter(c => c.type === 'expense').map(input).join('');
        }

        function saveBudgets() {
            const inputs = document.querySelectorAll('.budget-input');
            const updated = {};
            inputs.forEach(i => updated[i.dataset.cat] = parseFloat(i.value) || 0);
            annualBudgets[selectedBudgetMonth] = updated;
            renderAll(); alert('บันทึกแผนงานของเดือน ' + MONTHS[selectedBudgetMonth] + ' แล้ว');
        }

        function copyPrevMonthBudget() {
            const prev = selectedBudgetMonth === 0 ? 11 : selectedBudgetMonth - 1;
            annualBudgets[selectedBudgetMonth] = { ...annualBudgets[prev] };
            renderBudgetEditor();
        }

        function renderCategoryList() {
            const catExp = document.getElementById('cat-list-expense');
            const catInc = document.getElementById('cat-list-income');
            if(!catExp || !catInc) return;
            const pill = (c) => `<div class="px-3 py-1 bg-white border border-slate-100 rounded-full text-xs font-bold flex items-center gap-2 shadow-sm">${c.name}<button onclick="deleteCategory('${c.name}')" class="text-rose-400 font-bold hover:text-rose-600">×</button></div>`;
            catExp.innerHTML = CATEGORIES.filter(c => c.type === 'expense').map(pill).join('');
            catInc.innerHTML = CATEGORIES.filter(c => c.type === 'income').map(pill).join('');
        }

        function addCategory() {
            const n = document.getElementById('new-cat-name');
            if(!n || !n.value.trim()) return;
            CATEGORIES.push({ name: n.value, type: document.getElementById('new-cat-type')?.value || 'expense' });
            n.value = ''; ensureBudgetIntegrity(); renderAll();
        }

        function deleteCategory(name) { if(confirm('ลบหมวดหมู่ ' + name + '?')) { CATEGORIES = CATEGORIES.filter(c => c.name !== name); renderAll(); } }

        function openAccountModal(id = null) {
            editingAccountId = id;
            const modal = document.getElementById('account-modal');
            const nameInp = document.getElementById('new-acc-name');
            const typeInp = document.getElementById('new-acc-type');
            const balInp = document.getElementById('new-acc-balance');
            const title = document.getElementById('acc-modal-title');
            
            if (id && nameInp && typeInp && balInp) {
                const acc = accounts.find(a => a.id === id);
                nameInp.value = acc.name;
                typeInp.value = acc.type;
                balInp.value = acc.balance;
                if(title) title.innerText = "แก้ไขข้อมูลบัญชี";
            } else if(nameInp && typeInp && balInp) { 
                nameInp.value = ''; 
                balInp.value = ''; 
                if(title) title.innerText = "เพิ่มบัญชีใหม่";
            }
            if(modal) modal.classList.remove('hidden');
        }

        function closeAccountModal() { document.getElementById('account-modal')?.classList.add('hidden'); }

        function saveAccount() {
            const n = document.getElementById('new-acc-name')?.value;
            const t = document.getElementById('new-acc-type')?.value;
            const b = parseFloat(document.getElementById('new-acc-balance')?.value) || 0;
            if(!n || !t) return;
            if (editingAccountId) {
                const idx = accounts.findIndex(a => a.id === editingAccountId);
                if(idx !== -1) accounts[idx] = { ...accounts[idx], name: n, type: t, balance: b };
            } else accounts.push({ id: Date.now(), name: n, type: t, balance: b });
            closeAccountModal(); renderAll();
        }

        function updateCalculations() {
            const assets = accounts.filter(a => a.type !== 'debt').reduce((s, a) => s + a.balance, 0);
            const debt = accounts.filter(a => a.type === 'debt').reduce((s, a) => s + a.balance, 0);
            const net = assets - debt;
            const disp = document.getElementById('display-net-worth');
            if(disp) {
                disp.innerText = `฿ ${net.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                disp.style.color = net < 0 ? '#f43f5e' : '#047857';
            }
        }

        function renderCharts() {
            const canvas = document.getElementById('assetChart');
            if(!canvas) return;
            if(assetChart) assetChart.destroy();
            assetChart = new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: accounts.map(a => a.name),
                    datasets: [{ data: accounts.map(a => a.balance), backgroundColor: accounts.map((_,i) => `hsl(${150+(i*45)}, 60%, 50%)`), borderWidth: 4, borderColor: '#ffffff' }]
                },
                options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, padding: 15 } } } }
            });
        }

        const apiKeyGemini = "";
        async function analyzeFinancialHealth() {
            const insight = document.getElementById('ai-insight');
            if(!insight) return;
            insight.innerHTML = '<span class="flex items-center gap-2">🤖 Gemini กำลังวิเคราะห์แผนการเงินของคุณ... <span class="animate-pulse">●●●</span></span>';
            try {
                const cur = new Date().getMonth();
                const context = `Status: ${document.getElementById('display-net-worth')?.innerText}, Plans: ${JSON.stringify(annualBudgets[cur])}, History: ${JSON.stringify(transactions.slice(0, 3))}`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKeyGemini}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `วิเคราะห์ข้อมูลการเงินนี้ และแนะนำ 3 ข้อเป็นภาษาไทยสั้นๆ: ${context}` }] }],
                        systemInstruction: { parts: [{ text: "คุณคือ Wealth Strategist เชี่ยวชาญเรื่องงบประมาณส่วนบุคคล แนะนำให้เข้าใจง่ายและปฏิบัติได้จริง" }] }
                    })
                });
                const data = await res.json();
                insight.innerHTML = (data.candidates?.[0]?.content?.parts?.[0]?.text || "ลองกดใหม่อีกครั้งนะครับ").replace(/\n/g, '<br>');
            } catch (err) { insight.innerText = "ขัดข้องในการเชื่อมต่อ AI กรุณาลองใหม่ในภายหลัง"; }
        }

        window.onload = init;
    </script>
</body>
</html>
