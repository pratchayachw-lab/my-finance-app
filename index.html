<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WalletSync AI Pro</title>
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' },
                        income: '#10b981', expense: '#f43f5e', invest: '#3b82f6', debt: '#e11d48'
                    },
                    borderRadius: { 'xl2': '1.25rem', 'xl3': '2rem' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item.active { color: #059669; }
        .nav-item.active .icon-bg { background-color: #dcfce7; }
        .chart-container { position: relative; width: 100%; height: 220px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: slideUp 0.3s ease-out forwards; }
        .custom-scroll::-webkit-scrollbar { display: none; }
        input[type="date"], select, input[type="number"], input[type="text"] { font-size: 16px !important; }
        .edit-mode { border: 2px solid #fbbf24 !important; background-color: #fffbeb !important; }
        .loading-overlay { background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- Loading Overlay -->
    <div id="loading-screen" class="hidden fixed inset-0 z-[100] flex items-center justify-center loading-overlay">
        <div class="text-center p-6 bg-white rounded-3xl shadow-2xl">
            <div class="inline-block w-8 h-8 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-2"></div>
            <p class="text-sm font-bold text-brand-700" id="loading-text">กำลังซิงค์ข้อมูล...</p>
        </div>
    </div>

    <!-- Header Status Bar -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-40 px-3 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
            <!-- Net Worth -->
            <div class="flex items-center gap-1.5 shrink-0" onclick="switchTab('overview')">
                <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white text-base shadow-lg">฿</div>
                <div class="leading-tight">
                    <h1 class="text-[9px] font-bold text-slate-400 uppercase">Net Worth</h1>
                    <span class="text-sm font-black text-brand-700" id="display-net-worth">฿ 0.00</span>
                </div>
            </div>
            <!-- Month Net (จริง) -->
            <div class="border-l border-slate-100 pl-2 leading-tight shrink-0">
                <h1 class="text-[9px] font-bold text-slate-400 uppercase">Net (จริง)</h1>
                <span class="text-sm font-black text-brand-600" id="display-cash-flow">฿ 0.00</span>
            </div>
            <!-- Month Net (แผน) -->
            <div class="border-l border-slate-100 pl-2 leading-tight shrink-0">
                <h1 class="text-[9px] font-bold text-slate-400 uppercase">Net (แผน)</h1>
                <span class="text-sm font-black text-slate-400" id="display-plan-net">฿ 0.00</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2 shrink-0">
            <div id="sync-status" class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
            <button id="sync-toggle-btn" onclick="toggleSyncMode()" class="w-10 h-10 rounded-xl flex items-center justify-center border transition-all active:scale-90 shadow-sm">
                <span id="sync-icon" class="text-lg">☁️</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <!-- VIEW: OVERVIEW -->
        <div id="view-overview" class="fade-in space-y-6">
            <!-- Summary Dashboard -->
            <div class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">สรุปกระแสเงินสดเดือนนี้</h4>
                    <div id="cloud-indicator" class="text-[8px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 uppercase tracking-widest">Syncing...</div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="text-center p-2 rounded-2xl bg-emerald-50">
                        <span class="text-[10px] font-bold text-emerald-600 uppercase block">Income</span>
                        <span class="text-sm font-black text-emerald-700" id="m-income-val">฿ 0</span>
                    </div>
                    <div class="text-center p-2 rounded-2xl bg-rose-50">
                        <span class="text-[10px] font-bold text-rose-600 uppercase block">Expense</span>
                        <span class="text-sm font-black text-rose-700" id="m-expense-val">฿ 0</span>
                    </div>
                    <div class="text-center p-2 rounded-2xl bg-slate-50 border border-slate-100">
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">Net Flow</span>
                        <span class="text-sm font-black" id="m-net-val">฿ 0</span>
                    </div>
                </div>
            </div>

            <!-- Form Card -->
            <div id="form-container" class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="form-title" class="font-bold text-slate-800 text-lg">บันทึกรายการ</h3>
                    <div id="edit-indicator" class="hidden text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded tracking-wider uppercase leading-none">Editing Hist.</div>
                </div>
                <form onsubmit="handleTransaction(event)" class="space-y-4">
                    <div class="flex p-1 bg-slate-100 rounded-2xl">
                        <button type="button" onclick="setTxType('expense')" id="btn-type-expense" class="flex-1 py-2 text-sm font-bold rounded-xl bg-white shadow-sm text-expense transition-all">จ่าย</button>
                        <button type="button" onclick="setTxType('income')" id="btn-type-income" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500 transition-all">รับ</button>
                        <button type="button" onclick="setTxType('transfer')" id="btn-type-transfer" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500 transition-all">โอน</button>
                    </div>
                    <input type="hidden" id="tx-type" value="expense">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">ต้นทาง</label>
                            <select id="from-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="to-account-div" class="space-y-1 hidden">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">ปลายทาง</label>
                            <select id="to-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="date-div" class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">วันที่</label>
                            <input type="date" id="tx-date" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                        </div>
                    </div>

                    <div class="relative">
                        <input type="number" id="tx-amount" required placeholder="0.00" class="w-full p-5 bg-brand-50 border border-brand-100 rounded-2xl text-3xl font-black text-brand-700 text-center outline-none">
                        <div class="absolute left-5 top-1/2 -translate-y-1/2 text-brand-300 font-bold text-xl">฿</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div id="cat-select-container" class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">หมวดหมู่หลัก</label>
                            <select id="tx-category" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">หมวดหมู่ย่อย</label>
                            <input type="text" id="tx-sub-category" placeholder="เช่น กาแฟ, รถเมล์..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <input type="text" id="tx-note" placeholder="บันทึกช่วยจำ..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                    
                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submit-btn" class="flex-grow py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">บันทึกรายการ</button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden px-6 bg-slate-100 text-slate-500 font-bold rounded-2xl">ยกเลิก</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- VIEW: ACCOUNTS -->
        <div id="view-accounts" class="hidden fade-in space-y-4">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-xl font-black text-slate-800">จัดการบัญชี</h3>
                <button onclick="openAccountModal()" class="w-12 h-12 bg-brand-600 text-white rounded-2xl shadow-lg active:scale-90">+</button>
            </div>
            <div class="bg-white p-5 rounded-xl3 shadow-sm border border-slate-100">
                <div class="chart-container"><canvas id="assetChart"></canvas></div>
            </div>
            <div id="account-grid" class="space-y-4"></div>
        </div>

        <!-- VIEW: BUDGET -->
        <div id="view-budget" class="hidden fade-in space-y-8">
            <div class="bg-white p-6 rounded-xl3 shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-brand-700 mb-4 uppercase text-xs tracking-widest">จัดการหมวดหมู่</h3>
                <div class="flex flex-wrap gap-2 mb-6">
                    <select id="new-cat-type" class="p-2 border rounded-xl text-sm bg-slate-50 outline-none">
                        <option value="expense">จ่าย</option>
                        <option value="income">รับ</option>
                    </select>
                    <input type="text" id="new-cat-name" placeholder="ชื่อหมวดหมู่..." class="flex-grow p-2 border rounded-xl text-sm outline-none bg-slate-50">
                    <button onclick="addCategory()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-bold">+</button>
                </div>
                <div class="space-y-4">
                    <div><p class="text-[10px] font-bold text-rose-400 mb-2 uppercase">รายจ่าย</p><div id="cat-list-expense" class="flex flex-wrap gap-2"></div></div>
                    <div><p class="text-[10px] font-bold text-emerald-400 mb-2 uppercase">รายรับ</p><div id="cat-list-income" class="flex flex-wrap gap-2"></div></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl3 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-brand-700 uppercase text-xs tracking-widest">ตั้งงบประมาณ: <span id="editing-month-name" class="text-slate-400"></span></h3>
                    <button onclick="copyPrevMonthBudget()" class="text-[9px] font-bold text-brand-500 underline uppercase">เดือนก่อน</button>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-4 custom-scroll no-scrollbar" id="budget-month-selector"></div>
                <div id="budget-editor-income" class="space-y-4 border-b border-slate-100 pb-6"></div>
                <div id="budget-editor-expense" class="space-y-4 pt-6"></div>
                <button onclick="saveBudgets()" class="w-full mt-8 py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">บันทึกงบประมาณ</button>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="view-history" class="hidden fade-in space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <input type="text" id="filter-search" placeholder="ค้นหาประวัติ..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none" oninput="renderHistory()">
            </div>
            <div id="history-container" class="space-y-3"></div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-20 bottom-nav px-2 z-50">
        <button onclick="switchTab('overview')" id="nav-overview" class="nav-item active flex flex-col items-center gap-1 transition-all"><div class="icon-bg p-2 text-xl">🏠</div><span class="text-[10px] font-bold uppercase tracking-tighter">หน้าแรก</span></button>
        <button onclick="switchTab('accounts')" id="nav-accounts" class="nav-item flex flex-col items-center gap-1 transition-all"><div class="icon-bg p-2 text-xl">💳</div><span class="text-[10px] font-bold uppercase tracking-tighter">บัญชี</span></button>
        <button onclick="switchTab('budget')" id="nav-budget" class="nav-item flex flex-col items-center gap-1 transition-all"><div class="icon-bg p-2 text-xl">📊</div><span class="text-[10px] font-bold uppercase tracking-tighter">แผนงาน</span></button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-item flex flex-col items-center gap-1 transition-all"><div class="icon-bg p-2 text-xl">🕒</div><span class="text-[10px] font-bold uppercase tracking-tighter">ประวัติ</span></button>
    </nav>

    <!-- Account Modal -->
    <div id="account-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-xl font-black mb-6 text-center text-slate-800 uppercase tracking-tighter">จัดการบัญชี</h3>
            <div class="space-y-4">
                <input type="text" id="new-acc-name" placeholder="ชื่อบัญชี..." class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
                <select id="new-acc-type" class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
                    <option value="asset">ทรัพย์สิน/เงินสด</option>
                    <option value="investment">การลงทุน</option>
                    <option value="debt">หนี้สิน (ยืมเงิน)</option>
                </select>
                <input type="number" id="new-acc-balance" placeholder="ยอดเงินเริ่มต้น..." class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
            </div>
            <div class="flex gap-2 mt-8">
                <button onclick="saveAccount()" class="flex-1 py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95">บันทึก</button>
                <button onclick="closeAccountModal()" class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // --- ⚙️ CONFIG & STATE ---
        const SUPABASE_URL = "https://xyotqopwkcxblapoaiae.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3Rxb3B3a2N4YmxhcG9haWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDI0ODMsImV4cCI6MjA5MTQ3ODQ4M30.qNBaRDz9WGAXxX0tUcBLoMg6yA4Jz4EypTT_TJuZzkk";
        
        const VERSION = "v90_sub_categories";
        const ST_ACCS = `ws_accs_${VERSION}`;
        const ST_TXS = `ws_txs_${VERSION}`;
        const ST_CATS = `ws_cats_${VERSION}`;
        const ST_BUDGETS = `ws_budgets_${VERSION}`;

        let supabaseClient = null;
        let isSyncActive = localStorage.getItem('ws_sync_active') !== 'false';
        
        let CATEGORIES = JSON.parse(localStorage.getItem(ST_CATS)) || [
            { id: 1, name: 'เงินเดือน', type: 'income' }, { id: 2, name: 'อาหาร', type: 'expense' }, { id: 3, name: 'อื่นๆ', type: 'expense' }
        ];
        let accounts = JSON.parse(localStorage.getItem(ST_ACCS)) || [{ id: 1, name: 'เงินสด', type: 'asset', balance: 0 }];
        let transactions = JSON.parse(localStorage.getItem(ST_TXS)) || [];
        let annualBudgets = JSON.parse(localStorage.getItem(ST_BUDGETS)) || {};
        
        let editingTxId = null;
        let editingAccountId = null;
        let selectedBudgetMonth = new Date().getMonth();
        let assetChart = null;

        const MONTHS_LIST = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

        // --- 1. CORE UTILITIES ---

        function populateSelectors() {
            const opts = accounts.map(a => `<option value="${a.id}">${a.name} (฿${parseFloat(a.balance).toLocaleString()})</option>`).join('');
            const fromEl = document.getElementById('from-account');
            const toEl = document.getElementById('to-account');
            const catEl = document.getElementById('tx-category');
            
            if(fromEl) fromEl.innerHTML = opts;
            if(toEl) toEl.innerHTML = opts;
            
            const currentType = document.getElementById('tx-type')?.value || 'expense';
            const cats = CATEGORIES.filter(c => c.type === currentType);
            if(catEl) catEl.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function updateCalculations() {
            const netWorthTotal = accounts.reduce((s, a) => s + parseFloat(a.balance), 0);
            const now = new Date();
            const curM = now.getMonth();
            const curY = now.getFullYear();
            
            const monthlyTxs = transactions.filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === curM && d.getFullYear() === curY;
            });
            
            const inc = monthlyTxs.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount), 0);
            const exp = monthlyTxs.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
            const actualNet = inc - exp;
            
            const nwEl = document.getElementById('display-net-worth');
            if(nwEl) { nwEl.innerText = `฿ ${netWorthTotal.toLocaleString(undefined, {minimumFractionDigits:2})}`; nwEl.style.color = netWorthTotal < 0 ? '#f43f5e' : '#047857'; }
            
            const acEl = document.getElementById('display-cash-flow');
            if(acEl) { acEl.innerText = `฿ ${actualNet.toLocaleString(undefined, {minimumFractionDigits:2})}`; acEl.style.color = actualNet < 0 ? '#f43f5e' : '#059669'; }

            const planData = annualBudgets[curM] || {};
            let pInc = 0; let pExp = 0;
            CATEGORIES.forEach(c => {
                const val = parseFloat(planData[c.name] || 0);
                if(c.type === 'income') pInc += val; else pExp += val;
            });
            const planNet = pInc - pExp;
            const plEl = document.getElementById('display-plan-net');
            if(plEl) { plEl.innerText = `฿ ${planNet.toLocaleString(undefined, {minimumFractionDigits:2})}`; }

            if(document.getElementById('m-income-val')) document.getElementById('m-income-val').innerText = `฿ ${inc.toLocaleString()}`;
            if(document.getElementById('m-expense-val')) document.getElementById('m-expense-val').innerText = `฿ ${exp.toLocaleString()}`;
            const netValEl = document.getElementById('m-net-val');
            if(netValEl) { netValEl.innerText = `฿ ${actualNet.toLocaleString()}`; netValEl.style.color = actualNet < 0 ? '#f43f5e' : '#059669'; }
        }

        function renderAccountGrid() {
            const grid = document.getElementById('account-grid');
            if(!grid) return;
            grid.innerHTML = accounts.map(a => `
                <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div>
                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded bg-slate-100 tracking-wider">${a.type}</span>
                        <h4 class="font-bold text-slate-700 mt-1">${a.name}</h4>
                        <p class="text-xl font-black ${parseFloat(a.balance) < 0 ? 'text-rose-500' : 'text-slate-900'}">฿${parseFloat(a.balance).toLocaleString()}</p>
                    </div>
                    <button onclick="openAccountModal(${a.id})" class="p-3 text-slate-300 hover:text-brand-500 transition-colors">✏️</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if(!container) return;
            const q = document.getElementById('filter-search')?.value.toLowerCase() || "";
            const filtered = transactions.filter(t => t.note.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || (t.sub_category && t.sub_category.toLowerCase().includes(q)));
            
            container.innerHTML = filtered.map(t => `
                <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center active:bg-slate-50 transition-all" onclick="editTx(${t.id})">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold ${t.type==='income'?'bg-emerald-50 text-emerald-500':'bg-rose-50 text-rose-500'}">
                            ${t.type==='income'?'💰':t.type==='expense'?'💸':'↔️'}
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-slate-700">
                                ${t.category}${t.sub_category ? ` <span class="text-slate-300 font-normal">›</span> ${t.sub_category}` : ''}
                            </h4>
                            <p class="text-[10px] text-slate-400 uppercase">${new Date(t.date).toLocaleDateString()} • ${t.from}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-black ${t.type==='income'?'text-emerald-600':'text-rose-500'}">฿${parseFloat(t.amount).toLocaleString()}</p>
                        <button onclick="event.stopPropagation(); deleteTx(${t.id})" class="text-[8px] font-black text-rose-200 uppercase mt-1">ลบรายการ</button>
                    </div>
                </div>
            `).join('');
        }

        function renderCategoryList() {
            const pill = (c) => `<div class="px-3 py-1 bg-white border border-slate-100 rounded-full text-[10px] font-bold flex items-center gap-2 shadow-sm">${c.name}<button onclick="deleteCategory('${c.name}')" class="text-rose-400 font-black">×</button></div>`;
            const expList = document.getElementById('cat-list-expense');
            const incList = document.getElementById('cat-list-income');
            if(expList) expList.innerHTML = CATEGORIES.filter(c => c.type === 'expense').map(pill).join('');
            if(incList) incList.innerHTML = CATEGORIES.filter(c => c.type === 'income').map(pill).join('');
        }

        function renderBudgetEditor() {
            const b = annualBudgets[selectedBudgetMonth] || {};
            const input = (c) => `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <label class="flex-grow text-[11px] font-bold text-slate-600 uppercase">${c.name}</label>
                    <div class="relative">
                        <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-300">฿</span>
                        <input type="number" oninput="updateCalculations()" data-cat="${c.name}" value="${b[c.name]||0}" class="budget-input w-28 pl-5 pr-2 py-1 bg-white border rounded-xl text-right text-xs font-black outline-none focus:border-brand-500">
                    </div>
                </div>`;
            const incEd = document.getElementById('budget-editor-income');
            const expEd = document.getElementById('budget-editor-expense');
            if(incEd) incEd.innerHTML = `<p class="text-[10px] font-bold text-emerald-500 uppercase mb-4 tracking-widest">💰 เป้าหมายรายรับ</p>` + CATEGORIES.filter(c => c.type === 'income').map(input).join('');
            if(expEd) expEd.innerHTML = `<p class="text-[10px] font-bold text-rose-500 uppercase mb-4 tracking-widest">💸 เป้าหมายรายจ่าย</p>` + CATEGORIES.filter(c => c.type === 'expense').map(input).join('');
        }

        function renderMonthSelector() {
            const sel = document.getElementById('budget-month-selector');
            if(!sel) return;
            sel.innerHTML = MONTHS_LIST.map((m, i) => `<button onclick="selectMonth(${i})" class="px-4 py-2 whitespace-nowrap rounded-full border text-[10px] font-bold uppercase transition-all ${i===selectedBudgetMonth?'bg-brand-500 text-white border-brand-500 shadow-lg shadow-brand-500/20':'bg-slate-100 text-slate-400 border-slate-200'}">${m}</button>`).join('');
            const monthTitle = document.getElementById('editing-month-name');
            if(monthTitle) monthTitle.innerText = MONTHS_LIST[selectedBudgetMonth];
        }

        function renderAll() {
            updateCalculations();
            renderAccountGrid();
            renderHistory();
            renderCategoryList();
            populateSelectors();
            localStorage.setItem(ST_ACCS, JSON.stringify(accounts));
            localStorage.setItem(ST_TXS, JSON.stringify(transactions));
            localStorage.setItem(ST_CATS, JSON.stringify(CATEGORIES));
            localStorage.setItem(ST_BUDGETS, JSON.stringify(annualBudgets));
        }

        // --- 2. SUPABASE & SYNC ---

        async function initSupabase() {
            if (typeof supabase === 'undefined') return;
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                updateSyncUI();
                if(isSyncActive) await fetchFromCloud();
            } catch (e) { console.error("Supabase failed", e); }
        }

        async function fetchFromCloud() {
            if (!supabaseClient || !isSyncActive) return;
            showLoading(true, "ซิงค์ข้อมูล Cloud...");
            try {
                const { data: accData } = await supabaseClient.from('accounts').select('*');
                if (accData && accData.length > 0) accounts = accData;
                const { data: txData } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                if (txData) transactions = txData;
                const { data: catData } = await supabaseClient.from('categories').select('*');
                if (catData && catData.length > 0) CATEGORIES = catData;
                const { data: budData } = await supabaseClient.from('budgets').select('*');
                if (budData) budData.forEach(row => annualBudgets[row.month_key] = row.data);
                renderAll();
            } catch (e) { console.error("Cloud Error", e); }
            showLoading(false);
        }

        async function pushToCloud(table, data) {
            if (!supabaseClient || !isSyncActive) return;
            try { await supabaseClient.from(table).upsert(data); } catch (e) { console.error(`Push error`, e); }
        }

        async function toggleSyncMode() {
            isSyncActive = !isSyncActive;
            localStorage.setItem('ws_sync_active', isSyncActive);
            updateSyncUI();
            if (isSyncActive) await fetchFromCloud();
        }

        function updateSyncUI() {
            const btn = document.getElementById('sync-toggle-btn');
            const icon = document.getElementById('sync-icon');
            const dot = document.getElementById('sync-status');
            if(!btn) return;
            if (isSyncActive) {
                btn.classList.add('sync-btn-online'); btn.classList.remove('sync-btn-offline');
                icon.innerText = "☁️";
                if(dot) dot.classList.replace('bg-slate-200', 'bg-brand-500');
            } else {
                btn.classList.add('sync-btn-offline'); btn.classList.remove('sync-btn-online');
                icon.innerText = "💤";
                if(dot) dot.classList.replace('bg-brand-500', 'bg-slate-200');
            }
        }

        // --- 3. BUSINESS LOGIC HANDLERS ---

        function revertBalance(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            const fAcc = accounts.find(a => a.name === tx.from);
            const tAcc = tx.to ? accounts.find(a => a.name === tx.to) : null;
            if (tx.type === 'expense') { if(fAcc) fAcc.balance += parseFloat(tx.amount); }
            else if (tx.type === 'income') { if(fAcc) fAcc.balance -= parseFloat(tx.amount); }
            else { if(fAcc) fAcc.balance += parseFloat(tx.amount); if(tAcc) tAcc.balance -= parseFloat(tx.amount); }
        }

        async function handleTransaction(event) {
            event.preventDefault();
            if (editingTxId) revertBalance(editingTxId);

            const type = document.getElementById('tx-type').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const fromId = parseInt(document.getElementById('from-account').value);
            const fromAcc = accounts.find(a => a.id === fromId);

            if (type !== 'income' && amount > fromAcc.balance && fromAcc.type !== 'debt') return alert("ยอดเงินไม่พอ!");

            let newTx = {
                id: editingTxId || Math.floor(Math.random() * 100000000),
                type, amount, from: fromAcc.name,
                category: type === 'transfer' ? 'โอนเงิน' : document.getElementById('tx-category').value,
                sub_category: document.getElementById('tx-sub-category').value || null, // New field
                note: document.getElementById('tx-note').value,
                date: document.getElementById('tx-date').value || new Date().toISOString()
            };

            if (type === 'transfer') {
                const toAcc = accounts.find(a => a.id === parseInt(document.getElementById('to-account').value));
                fromAcc.balance -= amount; toAcc.balance += amount; newTx.to = toAcc.name;
                if(isSyncActive) { await pushToCloud('accounts', fromAcc); await pushToCloud('accounts', toAcc); }
            } else if (type === 'expense') {
                fromAcc.balance -= amount;
                if(isSyncActive) await pushToCloud('accounts', fromAcc);
            } else {
                fromAcc.balance += amount;
                if(isSyncActive) await pushToCloud('accounts', fromAcc);
            }

            if (editingTxId) {
                const idx = transactions.findIndex(t => t.id === editingTxId);
                transactions[idx] = newTx;
            } else transactions.unshift(newTx);

            if(isSyncActive) await pushToCloud('transactions', newTx);
            resetForm(); renderAll();
        }

        async function saveAccount() {
            const name = document.getElementById('new-acc-name').value;
            const type = document.getElementById('new-acc-type').value;
            const balance = parseFloat(document.getElementById('new-acc-balance').value) || 0;
            if(!name) return;
            let acc;
            if (editingAccountId) {
                const idx = accounts.findIndex(a => a.id === editingAccountId);
                accounts[idx] = { ...accounts[idx], name, type, balance };
                acc = accounts[idx];
            } else {
                acc = { id: Date.now(), name, type, balance };
                accounts.push(acc);
            }
            if(isSyncActive) await pushToCloud('accounts', acc);
            closeAccountModal(); renderAll();
        }

        async function saveBudgets() {
            const inputs = document.querySelectorAll('.budget-input');
            const updated = {};
            inputs.forEach(i => updated[i.dataset.cat] = parseFloat(i.value) || 0);
            annualBudgets[selectedBudgetMonth] = updated;
            if(isSyncActive) await supabaseClient.from('budgets').upsert({ month_key: selectedBudgetMonth.toString(), data: updated });
            renderAll(); alert('บันทึกงบประมาณสำเร็จ');
        }

        async function addCategory() {
            const name = document.getElementById('new-cat-name').value;
            const type = document.getElementById('new-cat-type').value;
            if(!name.trim()) return;
            const newCat = { id: Date.now(), name, type };
            CATEGORIES.push(newCat);
            if(isSyncActive) await pushToCloud('categories', newCat);
            document.getElementById('new-cat-name').value = '';
            renderAll();
        }

        async function deleteCategory(name) {
            if(confirm(`ลบหมวดหมู่ ${name}?`)) {
                const cat = CATEGORIES.find(c => c.name === name);
                CATEGORIES = CATEGORIES.filter(c => c.name !== name);
                if(isSyncActive && cat) await supabaseClient.from('categories').delete().eq('id', cat.id);
                renderAll();
            }
        }

        function copyPrevMonthBudget() {
            const prev = selectedBudgetMonth === 0 ? 11 : selectedBudgetMonth - 1;
            if(annualBudgets[prev]) {
                annualBudgets[selectedBudgetMonth] = { ...annualBudgets[prev] };
                renderBudgetEditor(); updateCalculations();
            } else alert("ยังไม่มีข้อมูลเดือนก่อนหน้า");
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            if(!tx) return;
            editingTxId = id;
            switchTab('overview');
            document.getElementById('form-container').classList.add('edit-mode');
            document.getElementById('edit-indicator').classList.remove('hidden');
            setTxType(tx.type);
            document.getElementById('tx-amount').value = tx.amount;
            document.getElementById('tx-note').value = tx.note;
            document.getElementById('tx-sub-category').value = tx.sub_category || '';
            document.getElementById('tx-date').value = new Date(tx.date).toISOString().split('T')[0];
            document.getElementById('tx-category').value = tx.category;
            const fAcc = accounts.find(a => a.name === tx.from);
            if(fAcc) document.getElementById('from-account').value = fAcc.id;
            if(tx.to) {
                const tAcc = accounts.find(a => a.name === tx.to);
                if(tAcc) document.getElementById('to-account').value = tAcc.id;
            }
            document.getElementById('submit-btn').innerText = "อัปเดตรายการ";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        async function deleteTx(id) {
            if(confirm('ลบรายการ?')) {
                revertBalance(id);
                transactions = transactions.filter(t => t.id !== id);
                if(isSyncActive) await supabaseClient.from('transactions').delete().eq('id', id);
                renderAll();
            }
        }

        // --- 4. NAVIGATION & UI ---

        function switchTab(tab) {
            ['overview', 'accounts', 'budget', 'history'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const nav = document.getElementById(`nav-${v}`);
                if(el) el.classList.add('hidden');
                if(nav) nav.classList.remove('active');
            });
            const target = document.getElementById(`view-${tab}`);
            const targetNav = document.getElementById(`nav-${tab}`);
            if(target) target.classList.remove('hidden');
            if(targetNav) targetNav.classList.add('active');
            if(tab === 'overview' || tab === 'accounts') renderCharts();
            if(tab === 'budget') { renderBudgetEditor(); renderMonthSelector(); }
            window.scrollTo(0, 0);
        }

        function selectMonth(i) { selectedBudgetMonth = i; renderMonthSelector(); renderBudgetEditor(); updateCalculations(); }

        function openAccountModal(id = null) {
            editingAccountId = id;
            const modal = document.getElementById('account-modal');
            if (id) {
                const acc = accounts.find(a => a.id === id);
                document.getElementById('new-acc-name').value = acc.name;
                document.getElementById('new-acc-type').value = acc.type;
                document.getElementById('new-acc-balance').value = acc.balance;
            } else {
                document.getElementById('new-acc-name').value = '';
                document.getElementById('new-acc-balance').value = '';
            }
            modal.classList.remove('hidden');
        }

        function closeAccountModal() { document.getElementById('account-modal').classList.add('hidden'); }
        function showLoading(show, txt) { document.getElementById('loading-screen').classList.toggle('hidden', !show); if(txt) document.getElementById('loading-text').innerText = txt; }
        
        function resetForm() {
            editingTxId = null;
            document.querySelector('form').reset();
            document.getElementById('form-container').classList.remove('edit-mode');
            document.getElementById('edit-indicator').classList.add('hidden');
            document.getElementById('submit-btn').innerText = "บันทึกรายการ";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            setTxType('expense');
            const elDate = document.getElementById('tx-date');
            if(elDate) elDate.value = new Date().toISOString().split('T')[0];
        }

        function setTxType(type) {
            const typeInp = document.getElementById('tx-type');
            if(typeInp) typeInp.value = type;
            ['income', 'expense', 'transfer'].forEach(t => {
                const btn = document.getElementById(`btn-type-${t}`);
                if(btn) btn.classList.toggle('bg-white', t === type);
            });
            const toAccDiv = document.getElementById('to-account-div');
            if(toAccDiv) toAccDiv.classList.toggle('hidden', type !== 'transfer');
            populateSelectors();
        }

        function renderCharts() {
            const canvas = document.getElementById('assetChart');
            if(!canvas) return;
            if(assetChart) assetChart.destroy();
            assetChart = new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: accounts.map(a => a.name),
                    datasets: [{ data: accounts.map(a => Math.abs(parseFloat(a.balance))), backgroundColor: accounts.map((_,i) => `hsl(${150+(i*45)}, 60%, 50%)`), borderWidth: 4, borderColor: '#ffffff' }]
                },
                options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        function ensureBudgetIntegrity() {
            for(let i=0; i<12; i++) {
                if (!annualBudgets[i]) annualBudgets[i] = {};
                CATEGORIES.forEach(cat => { if (annualBudgets[i][cat.name] === undefined) annualBudgets[i][cat.name] = 0; });
            }
        }

        function syncLocalToCloud() {
            if (!supabaseClient) return alert("โปรดรอการเชื่อมต่อ...");
            showLoading(true, "Force uploading...");
            Promise.all([
                ...accounts.map(acc => pushToCloud('accounts', acc)),
                ...transactions.map(tx => pushToCloud('transactions', tx))
            ]).then(() => {
                showLoading(false); alert("ซิงค์สำเร็จ!");
            });
        }

        function init() {
            const elDate = document.getElementById('tx-date');
            if(elDate) elDate.value = new Date().toISOString().split('T')[0];
            ensureBudgetIntegrity();
            initSupabase();
            renderAll();
        }

        window.onload = init;
    </script>
</body>
</html>
