<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WalletSync Premium</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOADING -->
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p id="loader-text" style="font-size:12px;font-weight:600;color:var(--text-muted);">กำลังโหลดระบบ...</p>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- ════════════════ HEADER ════════════════ -->
  <header class="header">
    <div class="header-inner">
      <div>
        <div class="header-title">NET WORTH</div>
        <div id="header-networth" class="header-value positive">฿0</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="text-align:right;">
          <div class="header-title">เดือนนี้</div>
          <div id="header-monthly-net" class="text-green" style="font-size:16px;font-weight:800;">฿0</div>
        </div>
        <button onclick="toggleSync()" id="sync-btn" class="btn-icon">
          <span id="sync-icon">☁️</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ════════════════ MAIN ════════════════ -->
  <main class="main-container">

    <!-- 🏠 HOME VIEW -->
    <div id="view-home" class="view active">
      
      <!-- Summary Strip -->
      <div class="grid-3">
        <div class="glass-card-sm flex-col" style="padding:16px;text-align:center;">
          <div style="font-size:10px;font-weight:700;color:var(--accent-green);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">รายรับ</div>
          <div id="stat-inc" style="font-size:18px;font-weight:900;color:var(--accent-green);letter-spacing:-0.5px;">฿0</div>
        </div>
        <div class="glass-card-sm flex-col" style="padding:16px;text-align:center;">
          <div style="font-size:10px;font-weight:700;color:var(--accent-red);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">รายจ่าย</div>
          <div id="stat-exp" style="font-size:18px;font-weight:900;color:var(--accent-red);letter-spacing:-0.5px;">฿0</div>
        </div>
        <div class="glass-card-sm flex-col" style="padding:16px;text-align:center;">
          <div style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">แผนคงเหลือ</div>
          <div id="stat-plan" style="font-size:18px;font-weight:900;color:var(--text-muted);letter-spacing:-0.5px;">฿0</div>
        </div>
      </div>

      <!-- Insight & Recommendation -->
      <div id="insight-card" class="insight-card">
        <!-- Content injected by JS -->
      </div>

      <!-- Recent Transactions -->
      <div class="section-title">
        <span>รายการล่าสุด</span>
        <button onclick="switchTab('history')" style="font-size:11px;font-weight:700;color:var(--accent-green);">ดูทั้งหมด →</button>
      </div>
      <div id="recent-list"></div>
    </div>

    <!-- 💳 ACCOUNTS VIEW -->
    <div id="view-accounts" class="view">
      <div class="section-title">
        <span>บัญชีทั้งหมด</span>
        <button onclick="openAccountSheet()" style="width:36px;height:36px;border-radius:12px;background:var(--accent-green);color:#000;font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:400;flex-shrink:0;">+</button>
      </div>
      
      <div class="glass-card" style="padding:16px;margin-bottom:20px;">
        <canvas id="chart-accounts" height="200"></canvas>
      </div>
      
      <div id="accounts-list"></div>
    </div>

    <!-- 📊 BUDGET VIEW -->
    <div id="view-budget" class="view">
      <!-- Month Tabs -->
      <div style="overflow-x:auto;padding-bottom:8px;margin-bottom:16px;">
        <div id="month-tabs" style="display:flex;gap:8px;width:max-content;"></div>
      </div>
      
      <!-- Progress List -->
      <div id="budget-progress" class="mb-lg"></div>
      
      <!-- Toggle Manage -->
      <button onclick="toggleManageCategories()" id="btn-manage-toggle" style="width:100%;padding:14px;border-radius:14px;border:1px dashed var(--border-strong);font-size:13px;font-weight:700;color:var(--text-muted);background:transparent;margin-bottom:12px;transition:all 0.2s;">⚙️ จัดการหมวดหมู่ & ตั้งงบประมาณ</button>
      
      <div id="manage-section" style="display:none;flex-direction:column;gap:16px;">
        
        <!-- Add Category -->
        <div class="glass-card" style="padding:16px;">
          <div class="section-title">เพิ่มหมวดหมู่ใหม่</div>
          <div class="flex-between gap-sm mb-sm">
            <select id="new-cat-type" class="input-field" style="width:auto;flex-shrink:0;">
              <option value="expense">💸 รายจ่าย</option>
              <option value="income">💰 รายรับ</option>
            </select>
            <input type="text" id="new-cat-name" class="input-field" placeholder="ชื่อหมวดหมู่หลัก...">
            <button onclick="handleAddCategory()" style="padding:0 16px;background:var(--accent-green);color:#000;border-radius:12px;font-weight:900;font-size:22px;height:44px;flex-shrink:0;">+</button>
          </div>
          <div class="flex-between gap-sm">
            <select id="manage-sub-parent" class="input-field" style="flex:1;"></select>
            <input type="text" id="new-sub-name" class="input-field" style="flex:1;" placeholder="ชื่อหมวดหมู่ย่อย...">
            <button onclick="handleAddSubCategory()" style="padding:0 16px;background:var(--bg-tertiary);color:var(--accent-green);border:1px solid var(--accent-green-border);border-radius:12px;font-weight:900;font-size:22px;height:44px;flex-shrink:0;">+</button>
          </div>
        </div>
        
        <!-- Category List -->
        <div class="glass-card" style="padding:16px;">
          <div class="section-title">💸 หมวดหมู่รายจ่าย</div>
          <div id="manage-list-expense" class="mb-md"></div>
          <div class="section-title">💰 หมวดหมู่รายรับ</div>
          <div id="manage-list-income"></div>
        </div>
        
        <!-- Budget Inputs -->
        <div class="glass-card" style="padding:16px;">
          <div class="section-title">ตั้งงบประมาณ</div>
          <div id="budget-editor-income" class="mb-md"></div>
          <div style="height:1px;background:var(--border-strong);margin:16px 0;"></div>
          <div id="budget-editor-expense"></div>
          
          <div style="display:flex;gap:12px;margin-top:20px;">
            <button onclick="copyPreviousMonthBudget()" class="btn-secondary" style="flex:1;">คัดลอกเดือนก่อน</button>
            <button onclick="saveBudgets()" class="btn-primary" style="flex:1.5;">บันทึกงบประมาณ</button>
          </div>
        </div>
        
      </div>
    </div>

    <!-- 🕒 HISTORY VIEW -->
    <div id="view-history" class="view">
      <div style="position:relative;margin-bottom:16px;">
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;">🔍</span>
        <input type="text" id="search-input" class="input-field" placeholder="ค้นหารายการ..." style="padding-left:42px;" oninput="renderHistoryList()">
      </div>
      <div id="history-list"></div>
    </div>

  </main>

  <!-- ════════════════ FAB ════════════════ -->
  <div id="fab-add" class="fab" onclick="openTransactionSheet()">+</div>

  <!-- ════════════════ BOTTOM NAV ════════════════ -->
  <nav class="nav-bar">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-item-icon">🏠</span><span class="nav-item-label">หน้าแรก</span>
    </button>
    <button class="nav-item" id="nav-accounts" onclick="switchTab('accounts')">
      <span class="nav-item-icon">💳</span><span class="nav-item-label">บัญชี</span>
    </button>
    <button class="nav-item" id="nav-budget" onclick="switchTab('budget')">
      <span class="nav-item-icon">📊</span><span class="nav-item-label">แผนงาน</span>
    </button>
    <button class="nav-item" id="nav-history" onclick="switchTab('history')">
      <span class="nav-item-icon">🕒</span><span class="nav-item-label">ประวัติ</span>
    </button>
  </nav>

  <!-- ════════════════ TRANSACTION BOTTOM SHEET ════════════════ -->
  <div class="sheet-overlay" id="overlay-tx" onclick="closeTransactionSheet()"></div>
  <div class="bottom-sheet" id="sheet-tx">
    <div class="sheet-handle" onclick="closeTransactionSheet()">
      <span style="font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0.05em;">แตะเพื่อปิด</span>
    </div>
    <div style="padding:0 20px 20px;">

      <!-- Header Row: close button + edit badge -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div id="badge-editing" style="display:none;">
          <span style="font-size:10px;font-weight:700;background:rgba(245,158,11,.15);color:var(--accent-amber);border:1px solid rgba(245,158,11,.3);padding:4px 12px;border-radius:20px;letter-spacing:0.06em;">✏️ EDITING</span>
        </div>
        <div id="badge-editing-placeholder"></div>
        <button onclick="closeTransactionSheet()" style="width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-strong);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;">✕</button>
      </div>

      <!-- Type Tabs -->
      <div class="type-tabs">
        <button class="type-tab expense active" id="tab-expense" onclick="setTransactionType('expense')">💸 จ่าย</button>
        <button class="type-tab income" id="tab-income" onclick="setTransactionType('income')">💰 รับ</button>
        <button class="type-tab transfer" id="tab-transfer" onclick="setTransactionType('transfer')">↔️ โอน</button>
      </div>

      <!-- Amount -->
      <div id="amount-display" class="numpad-amt expense">฿0</div>
      <div style="height:12px;margin-bottom:16px;"></div> <!-- Spacer -->

      <!-- Numpad -->
      <div class="numpad">
        <div class="numpad-key" onclick="numpadClick('1')">1</div>
        <div class="numpad-key" onclick="numpadClick('2')">2</div>
        <div class="numpad-key" onclick="numpadClick('3')">3</div>
        <div class="numpad-key" onclick="numpadClick('4')">4</div>
        <div class="numpad-key" onclick="numpadClick('5')">5</div>
        <div class="numpad-key" onclick="numpadClick('6')">6</div>
        <div class="numpad-key" onclick="numpadClick('7')">7</div>
        <div class="numpad-key" onclick="numpadClick('8')">8</div>
        <div class="numpad-key" onclick="numpadClick('9')">9</div>
        <div class="numpad-key" onclick="numpadClick('.')">.</div>
        <div class="numpad-key" onclick="numpadClick('0')">0</div>
        <div class="numpad-key delete" onclick="numpadDelete()">⌫</div>
      </div>

      <!-- Accounts row -->
      <div class="grid-3" style="grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
        <div>
          <label class="input-label">ต้นทาง</label>
          <select id="input-from-acc" class="input-field"></select>
        </div>
        <div id="transfer-wrap" style="display:none;">
          <label class="input-label">ปลายทาง</label>
          <select id="input-to-acc" class="input-field"></select>
        </div>
        <div>
          <label class="input-label">วันที่</label>
          <input type="date" id="input-date" class="input-field">
        </div>
      </div>

      <!-- Category Grid -->
      <div id="category-wrap" class="mb-md">
        <label class="input-label">หมวดหมู่หลัก</label>
        <div id="grid-main-cat" class="cat-grid"></div>
        
        <div id="subcat-wrap" style="display:none;margin-top:12px;">
          <label class="input-label">หมวดหมู่ย่อย</label>
          <div id="grid-sub-cat" class="cat-grid"></div>
        </div>
      </div>

      <!-- Note -->
      <input type="text" id="input-note" class="input-field mb-md" placeholder="📝 บันทึกช่วยจำ (ไม่บังคับ)">

      <!-- Actions -->
      <div style="display:flex;gap:12px;">
        <button id="btn-save-tx" onclick="handleSaveTransaction()" class="btn-primary" style="flex:1;">บันทึก</button>
      </div>

    </div>
  </div>

  <!-- ════════════════ ACCOUNT BOTTOM SHEET ════════════════ -->
  <div class="sheet-overlay" id="overlay-acc" onclick="closeAccountSheet()"></div>
  <div class="bottom-sheet" id="sheet-acc">
    <div class="sheet-handle" onclick="closeAccountSheet()">
      <span style="font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0.05em;">แตะเพื่อปิด</span>
    </div></div>
    <div style="padding:0 20px 20px;">

      <!-- Header Row -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div id="sheet-acc-title" style="font-size:20px;font-weight:800;">เพิ่มบัญชี</div>
        <button onclick="closeAccountSheet()" style="width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-strong);font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;">✕</button>
      </div>
      
      <div class="flex-col gap-md mb-lg">
        <div>
          <label class="input-label">ชื่อบัญชี</label>
          <input type="text" id="input-acc-name" class="input-field" placeholder="เช่น เงินสด, กสิกรไทย...">
        </div>
        
        <div>
          <label class="input-label">ประเภทบัญชี</label>
          <div class="type-tabs" style="margin-bottom:0;">
            <button onclick="setAccountType('asset')" id="acc-tab-asset" class="type-tab income active">💰 ทรัพย์สิน</button>
            <button onclick="setAccountType('investment')" id="acc-tab-investment" class="type-tab transfer">📈 ลงทุน</button>
            <button onclick="setAccountType('debt')" id="acc-tab-debt" class="type-tab expense">💳 หนี้สิน</button>
          </div>
          <input type="hidden" id="input-acc-type" value="asset">
        </div>
        
        <div>
          <label class="input-label">ยอดเงินปัจจุบัน</label>
          <input type="number" id="input-acc-balance" class="input-field" placeholder="0.00">
        </div>
      </div>
      
      <div style="display:flex;gap:12px;">
        <button onclick="closeAccountSheet()" class="btn-secondary" style="flex:1;">ปิด</button>
        <button onclick="handleSaveAccount()" class="btn-primary" style="flex:2;">บันทึก</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
