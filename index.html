<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WalletSync AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' },
                        income: '#10b981', expense: '#f43f5e', invest: '#3b82f6', debt: '#e11d48'
                    },
                    borderRadius: { 'xl2': '1.25rem', 'xl3': '2rem' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item.active { color: #059669; }
        .nav-item.active .icon-bg { background-color: #dcfce7; }
        .chart-container { position: relative; width: 100%; height: 220px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: slideUp 0.3s ease-out forwards; }
        .custom-scroll::-webkit-scrollbar { display: none; }
        .edit-mode { border: 2px solid #fbbf24 !important; background-color: #fffbeb !important; }
        .loading-overlay { background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); }
        .filter-chip { @apply px-3 py-1.5 rounded-xl border text-[10px] font-bold uppercase transition-all whitespace-nowrap; }
        .filter-chip.active { @apply bg-brand-600 text-white border-brand-600 shadow-md; }
        .filter-chip.inactive { @apply bg-white text-slate-400 border-slate-100; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <div id="loading-screen" class="hidden fixed inset-0 z-[100] flex items-center justify-center loading-overlay">
        <div class="text-center p-6 bg-white rounded-3xl shadow-2xl">
            <div class="inline-block w-8 h-8 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-2"></div>
            <p class="text-sm font-bold text-brand-700" id="loading-text">กำลังจัดการข้อมูล...</p>
        </div>
    </div>

    <header class="bg-white border-b border-slate-100 sticky top-0 z-40 px-5 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4" onclick="switchTab('overview')">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg shadow-brand-500/30">฿</div>
                <div>
                    <h1 class="text-[10px] font-bold text-slate-400 uppercase leading-none">Net Worth</h1>
                    <span class="text-lg font-black text-brand-700" id="display-net-worth">฿ 0.00</span>
                </div>
            </div>
            <div class="border-l border-slate-100 pl-4">
                <h1 class="text-[10px] font-bold text-slate-400 uppercase leading-none">Month Net</h1>
                <span class="text-lg font-black" id="display-cash-flow">฿ 0.00</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <div id="sync-status" class="w-2.5 h-2.5 rounded-full bg-slate-200" title="Status Indicator"></div>
            <button id="sync-toggle-btn" onclick="toggleSyncMode()" class="w-12 h-12 rounded-2xl flex items-center justify-center border transition-all active:scale-90">
                <span id="sync-icon" class="text-xl">☁️</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <div id="view-overview" class="fade-in space-y-6">
            <div class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">กระแสเงินสดเดือนนี้</h4>
                    <div id="cloud-indicator" class="text-[8px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 uppercase">Offline</div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="text-center p-2 rounded-2xl bg-emerald-50">
                        <span class="text-[10px] font-bold text-emerald-600 uppercase block">Income</span>
                        <span class="text-sm font-black text-emerald-700" id="m-income-val">฿ 0</span>
                    </div>
                    <div class="text-center p-2 rounded-2xl bg-rose-50">
                        <span class="text-[10px] font-bold text-rose-600 uppercase block">Expense</span>
                        <span class="text-sm font-black text-rose-700" id="m-expense-val">฿ 0</span>
                    </div>
                    <div class="text-center p-2 rounded-2xl bg-slate-50 border border-slate-100">
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">Net Flow</span>
                        <span class="text-sm font-black" id="m-net-val">฿ 0</span>
                    </div>
                </div>
            </div>

            <div id="form-container" class="bg-white p-5 rounded-xl3 border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="form-title" class="font-bold text-slate-800 text-lg">บันทึกรายการ</h3>
                    <div id="edit-indicator" class="hidden text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded">โหมดแก้ไข</div>
                </div>
                <form onsubmit="handleTransaction(event)" class="space-y-4">
                    <div class="flex p-1 bg-slate-100 rounded-2xl">
                        <button type="button" onclick="setTxType('expense')" id="btn-type-expense" class="flex-1 py-2 text-sm font-bold rounded-xl bg-white shadow-sm text-expense">จ่าย</button>
                        <button type="button" onclick="setTxType('income')" id="btn-type-income" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500">รับ</button>
                        <button type="button" onclick="setTxType('transfer')" id="btn-type-transfer" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500">โอน</button>
                    </div>
                    <input type="hidden" id="tx-type" value="expense">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">ต้นทาง</label>
                            <select id="from-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="to-account-div" class="space-y-1 hidden">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">ปลายทาง</label>
                            <select id="to-account" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                        </div>
                        <div id="date-div" class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">วันที่</label>
                            <input type="date" id="tx-date" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                        </div>
                    </div>
                    <div class="relative">
                        <input type="number" id="tx-amount" required placeholder="0.00" class="w-full p-5 bg-brand-50 border border-brand-100 rounded-2xl text-3xl font-black text-brand-700 text-center outline-none">
                        <div class="absolute left-5 top-1/2 -translate-y-1/2 text-brand-300 font-bold text-xl">฿</div>
                    </div>
                    <div id="cat-select-container" class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase">หมวดหมู่</label>
                        <select id="tx-category" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none"></select>
                    </div>
                    <input type="text" id="tx-note" placeholder="บันทึกช่วยจำ..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submit-btn" class="flex-grow py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">บันทึกรายการ</button>
                        <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden px-6 bg-slate-100 text-slate-500 font-bold rounded-2xl">ยกเลิก</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="view-history" class="hidden fade-in space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <input type="text" id="filter-search" placeholder="ค้นหา..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none" oninput="renderHistory()">
            </div>

            <div class="bg-slate-900 rounded-2xl p-4 overflow-hidden border border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h5 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">System Cloud Debug</h5>
                    <button onclick="testConnection()" class="text-[9px] bg-brand-600 text-white px-2 py-1 rounded-md font-bold">Check Connection</button>
                </div>
                <div id="debug-logs" class="text-[9px] font-mono text-emerald-400 max-h-40 overflow-y-auto leading-relaxed">
                    > System standby...
                </div>
            </div>

            <div id="history-container" class="space-y-3"></div>
        </div>

        <div id="view-accounts" class="hidden fade-in space-y-4">
            <div class="flex justify-between items-center px-2">
                <h3 class="text-xl font-black text-slate-800">จัดการบัญชี</h3>
                <button onclick="openAccountModal()" class="w-12 h-12 bg-brand-600 text-white rounded-2xl shadow-lg">+</button>
            </div>
            <div class="bg-white p-5 rounded-xl3 shadow-sm border border-slate-100">
                <div class="chart-container"><canvas id="assetChart"></canvas></div>
            </div>
            <div id="account-grid" class="space-y-4"></div>
        </div>
        
        <div id="view-budget" class="hidden fade-in space-y-4">
            <div class="bg-white p-5 rounded-xl3 shadow-sm border border-slate-200">
                <div id="cat-list-expense" class="flex flex-wrap gap-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="new-cat-name" placeholder="เพิ่มหมวดหมู่..." class="flex-1 p-2 border rounded-xl text-sm">
                    <button onclick="addCategory()" class="px-4 bg-brand-600 text-white rounded-xl font-bold">+</button>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-20 bottom-nav px-2 z-50">
        <button onclick="switchTab('overview')" id="nav-overview" class="nav-item active flex flex-col items-center gap-1"><div class="icon-bg p-2 text-xl">🏠</div><span class="text-[10px] font-bold uppercase">หน้าแรก</span></button>
        <button onclick="switchTab('accounts')" id="nav-accounts" class="nav-item flex flex-col items-center gap-1"><div class="icon-bg p-2 text-xl">💳</div><span class="text-[10px] font-bold uppercase">บัญชี</span></button>
        <button onclick="switchTab('budget')" id="nav-budget" class="nav-item flex flex-col items-center gap-1"><div class="icon-bg p-2 text-xl">📊</div><span class="text-[10px] font-bold uppercase">แผนงาน</span></button>
        <button onclick="switchTab('history')" id="nav-history" class="nav-item flex flex-col items-center gap-1"><div class="icon-bg p-2 text-xl">🕒</div><span class="text-[10px] font-bold uppercase">ประวัติ</span></button>
    </nav>

    <div id="account-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="text-xl font-black mb-6 text-center">จัดการบัญชี</h3>
            <div class="space-y-4">
                <input type="text" id="new-acc-name" placeholder="ชื่อบัญชี..." class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
                <select id="new-acc-type" class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
                    <option value="asset">ทรัพย์สิน/เงินสด</option>
                    <option value="investment">การลงทุน</option>
                    <option value="debt">หนี้สิน (ยืมเงิน)</option>
                </select>
                <input type="number" id="new-acc-balance" placeholder="ยอดเริ่มต้น..." class="w-full p-4 border rounded-2xl text-sm outline-none bg-slate-50">
            </div>
            <div class="flex gap-2 mt-8">
                <button onclick="saveAccount()" class="flex-1 py-4 bg-brand-600 text-white font-bold rounded-2xl shadow-lg">บันทึก</button>
                <button onclick="closeAccountModal()" class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG (FIXED URL) ---
        const SUPABASE_URL = "https://xyotqopwkcxblapoaiae.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3Rxb3B3a2N4YmxhcG9haWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDI0ODMsImV4cCI6MjA5MTQ3ODQ4M30.qNBaRDz9WGAXxX0tUcBLoMg6yA4Jz4EypTT_TJuZzkk";
        
        const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        let supabaseClient = null;
        let isSyncActive = localStorage.getItem('ws_sync_active') !== 'false';
        let assetChart = null;

        // Models
        let CATEGORIES = JSON.parse(localStorage.getItem('ws_cats_v30')) || [{ name: 'อาหาร', type: 'expense' }, { name: 'เงินเดือน', type: 'income' }];
        let accounts = JSON.parse(localStorage.getItem('ws_accs_v30')) || [{ id: 1, name: 'เงินสด', type: 'asset', balance: 0 }];
        let transactions = JSON.parse(localStorage.getItem('ws_txs_v30')) || [];
        let annualBudgets = JSON.parse(localStorage.getItem('ws_budgets_v30')) || {};
        let editingTxId = null;
        let histFilters = { type: 'all' };

        // --- GLOBAL UTILITIES ---
        function logDebug(msg, isError = false) {
            const logs = document.getElementById('debug-logs');
            if(!logs) return;
            const time = new Date().toLocaleTimeString();
            logs.innerHTML = `<div class="${isError?'text-rose-400':'text-emerald-400'} mb-1"># [${time}] ${msg}</div>` + logs.innerHTML;
        }

        function resetForm() {
            editingTxId = null;
            const form = document.querySelector('form');
            if(form) form.reset();
            document.getElementById('form-container').classList.remove('edit-mode');
            document.getElementById('edit-indicator').classList.add('hidden');
            document.getElementById('submit-btn').innerText = "บันทึกรายการ";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            setDefaultDate(); setTxType('expense');
        }

        function setDefaultDate() { const el = document.getElementById('tx-date'); if(el) el.value = new Date().toISOString().split('T')[0]; }

        function ensureBudgetIntegrity() {
            for(let i=0; i<12; i++) {
                if (!annualBudgets[i]) annualBudgets[i] = {};
                CATEGORIES.forEach(cat => { if (annualBudgets[i][cat.name] === undefined) annualBudgets[i][cat.name] = 0; });
            }
        }

        // --- SUPABASE ENGINE ---
        async function initSupabase() {
            if (typeof supabase === 'undefined') return logDebug("Supabase Lib NOT LOADED", true);
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                logDebug("Supabase Initialized");
                updateSyncUI();
                if(isSyncActive) await fetchFromCloud();
            } catch (e) { logDebug("Init Error: " + e.message, true); }
        }

        async function testConnection() {
            logDebug("Testing database connection...");
            try {
                const { data, error } = await supabaseClient.from('transactions').select('id').limit(1);
                if (error) throw error;
                logDebug("✅ Connection OK - Read Success");
                alert("เชื่อมต่อฐานข้อมูลได้ปกติครับ!");
            } catch (e) { 
                logDebug("❌ Connection Failed: " + e.message, true); 
                alert("เกิดข้อผิดพลาด: " + e.message);
            }
        }

        async function fetchFromCloud() {
            if (!supabaseClient || !isSyncActive) return;
            showLoading(true, "ซิงค์ข้อมูลจาก Cloud...");
            try {
                const { data, error } = await supabaseClient.from('transactions').select('*').order('date', { ascending: false });
                if (error) throw error;
                if (data) {
                    transactions = data;
                    logDebug(`Fetched ${data.length} records`);
                    renderAll();
                }
            } catch (e) { logDebug("Fetch Error: " + e.message, true); }
            showLoading(false);
        }

        async function pushToCloud(tx) {
            if (!supabaseClient || !isSyncActive) return;
            try {
                const { error } = await supabaseClient.from('transactions').upsert(tx);
                if (error) {
                    logDebug("Push Error: " + error.message, true);
                    alert("บันทึกออนไลน์ไม่สำเร็จ: " + error.message);
                } else {
                    logDebug(`Synced OK`);
                }
            } catch (e) { logDebug("Push Exception: " + e.message, true); }
        }

        async function toggleSyncMode() {
            isSyncActive = !isSyncActive;
            localStorage.setItem('ws_sync_active', isSyncActive);
            updateSyncUI();
            if (isSyncActive) await fetchFromCloud();
        }

        function updateSyncUI() {
            const btn = document.getElementById('sync-toggle-btn');
            const icon = document.getElementById('sync-icon');
            const ind = document.getElementById('cloud-indicator');
            const dot = document.getElementById('sync-status');
            if(!btn) return;
            if (isSyncActive) {
                btn.classList.add('sync-btn-online'); btn.classList.remove('sync-btn-offline');
                icon.innerText = "☁️";
                if(ind) { ind.innerText = "ONLINE"; ind.className = "text-[8px] font-bold px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 uppercase"; }
                if(dot) dot.classList.replace('bg-slate-200', 'bg-brand-500');
            } else {
                btn.classList.add('sync-btn-offline'); btn.classList.remove('sync-btn-online');
                icon.innerText = "💤";
                if(ind) { ind.innerText = "OFFLINE"; ind.className = "text-[8px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 uppercase"; }
                if(dot) dot.classList.replace('bg-brand-500', 'bg-slate-200');
            }
        }

        // --- UI CORE RENDERS ---
        function updateCalculations() {
            const netTotal = accounts.reduce((s, a) => s + a.balance, 0);
            const now = new Date();
            const monthlyTxs = transactions.filter(t => new Date(t.date).getMonth() === now.getMonth());
            const inc = monthlyTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const exp = monthlyTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            
            document.getElementById('display-net-worth').innerText = `฿ ${netTotal.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('display-cash-flow').innerText = `฿ ${(inc-exp).toLocaleString()}`;
            document.getElementById('m-income-val').innerText = `฿ ${inc.toLocaleString()}`;
            document.getElementById('m-expense-val').innerText = `฿ ${exp.toLocaleString()}`;
            const netEl = document.getElementById('m-net-val');
            netEl.innerText = `฿ ${(inc-exp).toLocaleString()}`;
            netEl.style.color = (inc-exp) < 0 ? '#f43f5e' : '#059669';
        }

        function renderAccountGrid() {
            document.getElementById('account-grid').innerHTML = accounts.map(a => `
                <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div>
                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded bg-slate-100 tracking-wider">${a.type}</span>
                        <h4 class="font-bold text-slate-700 mt-1">${a.name}</h4>
                        <p class="text-xl font-black ${a.balance < 0 ? 'text-rose-500' : 'text-slate-900'}">฿${a.balance.toLocaleString()}</p>
                    </div>
                    <button onclick="openAccountModal(${a.id})" class="p-3 text-slate-300">✏️</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const q = document.getElementById('filter-search').value.toLowerCase();
            const filtered = transactions.filter(t => t.note.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
            container.innerHTML = filtered.map(t => `
                <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center active:bg-slate-50 transition-all" onclick="editTx(${t.id})">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold ${t.type==='income'?'bg-emerald-50 text-emerald-500':'bg-rose-50 text-rose-500'}">
                            ${t.type==='income'?'💰':t.type==='expense'?'💸':'↔️'}
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-slate-700">${t.category}</h4>
                            <p class="text-[10px] text-slate-400 uppercase">${t.date.split('T')[0]} • ${t.from}</p>
                        </div>
                    </div>
                    <p class="font-black ${t.type==='income'?'text-emerald-600':'text-rose-500'}">฿${t.amount.toLocaleString()}</p>
                </div>
            `).join('');
        }

        function populateSelectors() {
            const opts = accounts.map(a => `<option value="${a.id}">${a.name} (฿${a.balance.toLocaleString()})</option>`).join('');
            document.getElementById('from-account').innerHTML = opts;
            const toAcc = document.getElementById('to-account');
            if(toAcc) toAcc.innerHTML = opts;
            const cats = CATEGORIES.filter(c => c.type === document.getElementById('tx-type').value);
            document.getElementById('tx-category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        // --- HANDLERS ---
        async function handleTransaction(event) {
            event.preventDefault();
            if (editingTxId) revertBalance(editingTxId);

            const type = document.getElementById('tx-type').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const fromId = parseInt(document.getElementById('from-account').value);
            const fromAcc = accounts.find(a => a.id === fromId);

            if (type !== 'income' && amount > fromAcc.balance && fromAcc.type !== 'debt') return alert("ยอดเงินไม่พอ!");

            let newTx = {
                id: editingTxId || Date.now(),
                type, amount, from: fromAcc.name,
                category: type === 'transfer' ? 'โอนเงิน' : document.getElementById('tx-category').value,
                note: document.getElementById('tx-note').value,
                date: document.getElementById('tx-date').value || new Date().toISOString()
            };

            if (type === 'transfer') {
                const toAcc = accounts.find(a => a.id === parseInt(document.getElementById('to-account').value));
                fromAcc.balance -= amount; toAcc.balance += amount; newTx.to = toAcc.name;
            } else if (type === 'expense') fromAcc.balance -= amount;
            else fromAcc.balance += amount;

            if (editingTxId) {
                const idx = transactions.findIndex(t => t.id === editingTxId);
                if(idx !== -1) transactions[idx] = newTx;
            } else transactions.unshift(newTx);

            if(isSyncActive) await pushToCloud(newTx);
            resetForm(); renderAll();
        }

        function revertBalance(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            const f = accounts.find(a => a.name === tx.from);
            const t = accounts.find(a => a.name === tx.to);
            if (tx.type === 'expense') { if(f) f.balance += tx.amount; }
            else if (tx.type === 'income') { if(f) f.balance -= tx.amount; }
            else { if(f) f.balance += tx.amount; if(t) t.balance -= tx.amount; }
        }

        function setTxType(type) {
            document.getElementById('tx-type').value = type;
            ['income', 'expense', 'transfer'].forEach(t => {
                const btn = document.getElementById(`btn-type-${t}`);
                if(btn) btn.classList.toggle('bg-white', t === type);
            });
            document.getElementById('to-account-div')?.classList.toggle('hidden', type !== 'transfer');
            populateSelectors();
        }

        function renderAll() {
            updateCalculations(); renderAccountGrid(); renderCharts(); renderHistory(); 
            populateSelectors();
            localStorage.setItem('ws_accs_v30', JSON.stringify(accounts));
            localStorage.setItem('ws_txs_v30', JSON.stringify(transactions));
            localStorage.setItem('ws_cats_v30', JSON.stringify(CATEGORIES));
        }

        function switchTab(tab) {
            ['overview', 'accounts', 'budget', 'history'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if(el) el.classList.add('hidden');
                const nav = document.getElementById(`nav-${v}`);
                if(nav) nav.classList.remove('active');
            });
            document.getElementById(`view-${tab}`)?.classList.remove('hidden');
            document.getElementById(`nav-${tab}`)?.classList.add('active');
            if(tab === 'overview' && typeof renderCharts === 'function') renderCharts();
        }

        function renderCharts() {
            const canvas = document.getElementById('assetChart');
            if(!canvas) return;
            if(assetChart) assetChart.destroy();
            assetChart = new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: accounts.map(a => a.name),
                    datasets: [{ data: accounts.map(a => Math.abs(a.balance)), backgroundColor: accounts.map((_,i) => `hsl(${150+(i*45)}, 60%, 50%)`), borderWidth: 4, borderColor: '#ffffff' }]
                },
                options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        function showLoading(show, txt) { document.getElementById('loading-screen').classList.toggle('hidden', !show); if(txt) document.getElementById('loading-text').innerText = txt; }

        function openAccountModal(id = null) {
            editingAccountId = id;
            const modal = document.getElementById('account-modal');
            const nInp = document.getElementById('new-acc-name');
            const tInp = document.getElementById('new-acc-type');
            const bInp = document.getElementById('new-acc-balance');
            if (id) {
                const acc = accounts.find(a => a.id === id);
                nInp.value = acc.name; tInp.value = acc.type; bInp.value = acc.balance;
            } else { nInp.value = ''; bInp.value = ''; }
            modal.classList.remove('hidden');
        }

        function closeAccountModal() { document.getElementById('account-modal').classList.add('hidden'); }

        function saveAccount() {
            const n = document.getElementById('new-acc-name').value;
            const t = document.getElementById('new-acc-type').value;
            const b = parseFloat(document.getElementById('new-acc-balance').value) || 0;
            if(!n) return;
            if (editingAccountId) {
                const idx = accounts.findIndex(a => a.id === editingAccountId);
                accounts[idx] = { ...accounts[idx], name: n, type: t, balance: b };
            } else accounts.push({ id: Date.now(), name: n, type: t, balance: b });
            closeAccountModal(); renderAll();
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            editingTxId = id; switchTab('overview');
            document.getElementById('form-container').classList.add('edit-mode');
            document.getElementById('edit-indicator').classList.remove('hidden');
            setTxType(tx.type);
            document.getElementById('tx-amount').value = tx.amount;
            document.getElementById('tx-note').value = tx.note;
            document.getElementById('tx-date').value = tx.date.split('T')[0];
            document.getElementById('tx-category').value = tx.category;
            document.getElementById('submit-btn').innerText = "อัปเดต";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        function init() {
            initSupabase(); ensureBudgetIntegrity(); setDefaultDate();
            renderAll();
        }

        window.onload = init;
    </script>
</body>
</html>
